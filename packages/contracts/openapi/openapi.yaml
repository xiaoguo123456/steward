openapi: 3.0.3

info:
  title: AI事管家 API
  version: 1.0.0
  description: |
    AI事管家的唯一网络契约来源。前后端不得在任一侧手写 DTO、URL、枚举或错误码。

    约定：
    - 所有成功响应统一为 `{data, meta}`，集合额外带 `page`。
    - 所有错误响应统一为 `{error, meta}`，App 只依赖 `error.code` 分支。
    - 写请求必须携带 `Idempotency-Key`；并发编辑应携带 `If-Match`。
    - 异步处理返回 `202` 与 `operation_id`，客户端通过 Operation 轮询。
    - 私有内容默认 `Cache-Control: private, no-store`。

servers:
  - url: http://localhost:8787
    description: 本地开发
  - url: https://api.example.com
    description: 生产占位；正式域名待运维确认

security:
  - bearerAuth: []

