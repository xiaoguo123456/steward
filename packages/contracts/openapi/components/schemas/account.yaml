# 账户、鉴权、用户资料与偏好。

PhoneCodeRequest:
  type: object
  additionalProperties: false
  required: [phone]
  properties:
    phone:
      type: string
      description: 中国大陆手机号，11 位数字。
      pattern: '^1[3-9][0-9]{9}$'
      example: "13800138000"
    purpose:
      type: string
      description: 验证码用途，用于区分登录与换绑等场景的限流口径。
      enum: [login]
      default: login

PhoneCodeResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds:
          type: integer
          description: 验证码有效期。
        resend_after_seconds:
          type: integer
          description: 允许再次发送前需要等待的秒数。
        dev_code:
          type: string
          nullable: true
          description: 仅在开发环境返回的固定验证码，生产环境恒为 null。
    meta:
      $ref: './common.yaml#/ResponseMeta'

LoginRequest:
  type: object
  additionalProperties: false
  required: [phone, code]
  properties:
    phone:
      type: string
      pattern: '^1[3-9][0-9]{9}$'
    code:
      type: string
      pattern: '^[0-9]{6}$'
    timezone:
      type: string
      description: 客户端当前 IANA 时区，用于首次初始化默认值。
      example: Asia/Shanghai

TokenPair:
  type: object
  additionalProperties: false
  required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    access_expires_at:
      type: string
      format: date-time
    refresh_expires_at:
      type: string
      format: date-time

LoginResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [tokens, user, is_new_user]
      properties:
        tokens:
          $ref: '#/TokenPair'
        user:
          $ref: '#/User'
        is_new_user:
          type: boolean
          description: 为 true 时 App 进入初始化流程。
    meta:
      $ref: './common.yaml#/ResponseMeta'

RefreshRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token:
      type: string

RefreshResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/TokenPair'
    meta:
      $ref: './common.yaml#/ResponseMeta'

User:
  type: object
  additionalProperties: false
  required: [id, phone, display_name, timezone, initialized, created_at, updated_at]
  properties:
    id:
      type: string
      example: usr_01J8Z3
    phone:
      type: string
      description: 已脱敏的手机号，中间四位为星号。
      example: "138****8000"
    display_name:
      type: string
    avatar_url:
      type: string
      nullable: true
    timezone:
      type: string
      description: 用户时区，所有日期语义换算的基准。
      example: Asia/Shanghai
    initialized:
      type: boolean
      description: 是否已完成首次初始化流程。
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/User'
    meta:
      $ref: './common.yaml#/ResponseMeta'

UpdateUserRequest:
  type: object
  additionalProperties: false
  properties:
    display_name:
      type: string
      minLength: 1
      maxLength: 40
    avatar_url:
      type: string
      nullable: true
    timezone:
      type: string

UserPreferences:
  type: object
  additionalProperties: false
  required: [week_start, work_day_start, work_day_end, default_reminder_local_time, updated_at]
  properties:
    week_start:
      type: string
      description: 周视图起始日。
      enum: [monday, sunday]
    work_day_start:
      type: string
      description: 工作时间开始，格式 HH:MM，用于安排建议与日历高亮。
      example: "09:00"
    work_day_end:
      type: string
      example: "18:00"
    default_reminder_local_time:
      type: string
      description: 全天 Event 与 due_date 提醒的默认当地触发时间。
      example: "09:00"
    updated_at:
      type: string
      format: date-time

UserPreferencesResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/UserPreferences'
    meta:
      $ref: './common.yaml#/ResponseMeta'

UpdateUserPreferencesRequest:
  type: object
  additionalProperties: false
  properties:
    week_start:
      type: string
      enum: [monday, sunday]
    work_day_start:
      type: string
    work_day_end:
      type: string
    default_reminder_local_time:
      type: string

AiSettings:
  type: object
  additionalProperties: false
  required: [capture_parse_enabled, suggestion_enabled, memory_learning_enabled, updated_at]
  properties:
    capture_parse_enabled:
      type: boolean
      description: 关闭后 Capture 只保存原始输入，不调用 AI 解析。
    suggestion_enabled:
      type: boolean
      description: 关闭后不生成任何 AI 建议。
    memory_learning_enabled:
      type: boolean
      description: 关闭后不再生成新的长期记忆建议。
    updated_at:
      type: string
      format: date-time

AiSettingsResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/AiSettings'
    meta:
      $ref: './common.yaml#/ResponseMeta'

UpdateAiSettingsRequest:
  type: object
  additionalProperties: false
  properties:
    capture_parse_enabled:
      type: boolean
    suggestion_enabled:
      type: boolean
    memory_learning_enabled:
      type: boolean
