# 各实体的成功响应信封。所有成功响应统一为 {data, meta}，列表额外带 page。
# 命名规则：单数=单个实体，复数=集合。TaskList 是清单实体，Tasks 才是 Task 集合。

TaskResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: './objects.yaml#/Task'
    meta:
      $ref: './common.yaml#/ResponseMeta'

TasksResponse:
  type: object
  additionalProperties: false
  required: [data, page, meta]
  properties:
    data:
      type: array
      items:
        $ref: './objects.yaml#/Task'
    page:
      $ref: './common.yaml#/PageInfo'
    meta:
      $ref: './common.yaml#/ResponseMeta'

