  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [affected_resources]
      properties:
        affected_resources:
          type: array
          items:
            $ref: './common.yaml#/AffectedResource'
        activity_batch_id:
          type: string
          nullable: true
    meta:
      $ref: './common.yaml#/ResponseMeta'
