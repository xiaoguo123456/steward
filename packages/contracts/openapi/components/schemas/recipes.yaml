# 菜谱是只读内容，不是用户数据。
#
# 它由平台提供、所有用户共享，因此不受行级安全约束，也没有创建与修改接口。
#
# 用户自己的东西在本文件后半段：饮食档案、收藏、做过与本周菜单，
# 每一样都带 user_id 并受行级安全约束。「实际摄入」不在这里——
# 那是 Record，走记录项接口。
#
# 任何一条正式菜谱进库之前，来源、作者、授权范围与版本必须齐全：
# 没有这些字段就等于不知道自己有没有权利展示它。

RecipeDifficulty:
  type: string
  enum: [easy, medium, hard]

RecipeMealSlot:
  type: string
  enum: [breakfast, lunch, dinner]

RecipeGoal:
  type: string
  description: |
    steady_sugar 只用于推荐少添加糖、优先全谷物、增加膳食纤维的日常菜谱，
    不提供疾病诊断、治疗承诺或用药建议。
  enum: [balanced, fat_loss, muscle_gain, steady_sugar]

RecipeCategory:
  type: string
  enum: [recommended, quick, seasonal, fat_loss, muscle_gain, steady_sugar]

RecipeIngredientGroup:
  type: string
  description: 与购物清单的品类分开：这里是做菜时的分组，不是超市货架。
  enum: [produce, protein, staple, seasoning]

RecipeIngredient:
  type: object
  additionalProperties: false
  required: [name, amount, group]
  properties:
    name:
      type: string
    amount:
      type: string
      description: 自由文本，例如「300 克」「适量」。生成购物清单时按名称合并。
    group:
      $ref: '#/RecipeIngredientGroup'

RecipeStep:
  type: object
  additionalProperties: false
  required: [title, description]
  properties:
    title:
      type: string
    description:
      type: string
    timer_minutes:
      type: integer
      nullable: true
      description: 这一步需要计时时给出分钟数，烹饪模式据此提供倒计时。

RecipeNutrition:
  type: object
  additionalProperties: false
  required: [calories, protein_g, carbs_g, fiber_g]
  description: |
    每份的营养估算。它是估算值，不是营养档案，也不构成任何健康承诺。
  properties:
    calories:
      type: number
      format: double
    protein_g:
      type: number
      format: double
    carbs_g:
      type: number
      format: double
    fiber_g:
      type: number
      format: double

RecipeSource:
  type: object
  additionalProperties: false
  required: [name, license, content_version]
  description: |
    内容来源与授权。字段不全的菜谱不允许进库：
    不知道来源和授权范围，就等于不知道自己有没有权利展示它。
  properties:
    name:
      type: string
      description: 内容提供方。
    author:
      type: string
      nullable: true
    url:
      type: string
      nullable: true
      description: 原始出处。
    license:
      type: string
      description: 授权范围，例如 CC-BY-4.0、平台自有内容。
    license_url:
      type: string
      nullable: true
    image_credit:
      type: string
      nullable: true
      description: 图片的权利说明。没有明确权利的图片不下发 image_url。
    content_version:
      type: string
      description: 内容版本。来源更新时递增，客户端据此判断缓存是否过期。

Recipe:
  type: object
  additionalProperties: false
  required:
    [id, title, servings, duration_minutes, difficulty, nutrition,
     meal_slots, categories, goals, tags, allergens, ingredients, steps, source]
  properties:
    id:
      type: string
      example: rcp_01J8Z3
    title:
      type: string
    summary:
      type: string
      nullable: true
    image_url:
      type: string
      nullable: true
      description: |
        没有明确图片权利时为 null，客户端展示占位而不是随便找一张图。
    servings:
      type: integer
      minimum: 1
    duration_minutes:
      type: integer
      minimum: 1
    difficulty:
      $ref: '#/RecipeDifficulty'
    nutrition:
      $ref: '#/RecipeNutrition'
    meal_slots:
      type: array
      items:
        $ref: '#/RecipeMealSlot'
    categories:
      type: array
      items:
        $ref: '#/RecipeCategory'
    goals:
      type: array
      items:
        $ref: '#/RecipeGoal'
    tags:
      type: array
      items:
        type: string
    allergens:
      type: array
      description: |
        过敏原是确定性硬过滤条件，任何排序或推荐都不得覆盖它。
      items:
        type: string
    ingredients:
      type: array
      minItems: 1
      items:
        $ref: '#/RecipeIngredient'
    steps:
      type: array
      minItems: 1
      items:
        $ref: '#/RecipeStep'
    source:
      $ref: '#/RecipeSource'

RecipeResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/Recipe'
    meta:
      $ref: './common.yaml#/ResponseMeta'

RecipesResponse:
  type: object
  additionalProperties: false
  required: [data, page, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/Recipe'
    page:
      $ref: './common.yaml#/PageInfo'
    meta:
      $ref: './common.yaml#/ResponseMeta'

# ---- 以下是用户自己的数据，受行级安全约束 ----
#
# 菜谱本身是共享的只读内容；下面这些是「谁想吃什么」，每个用户各一份。

DietGoal:
  type: string
  description: |
    与 RecipeGoal 取值一致：用户的目标要能直接拿去筛菜谱。
    steady_sugar 只用于推荐少糖、全谷物、高纤维的日常菜谱，
    不提供疾病诊断、治疗承诺或用药建议。
  enum: [balanced, fat_loss, muscle_gain, steady_sugar]

DietActivityLevel:
  type: string
  enum: [sedentary, light, moderate, active]

DietBudget:
  type: string
  enum: [economy, standard, flexible]

DietSex:
  type: string
  description: 仅用于能量估算。用户可以不填。
  enum: [female, male, unspecified]

DietProfile:
  type: object
  additionalProperties: false
  description: |
    饮食档案。**身体数据属于高敏信息**：只允许用户自己填写与修改，
    不接受任何推断，也不得写入日志、埋点、Prompt 快照或测试 Fixture。

    allergens 与 dislikes 是确定性硬过滤条件，排序与推荐都不得覆盖它们。
  required: [goal, allergens, dislikes, servings, updated_at]
  properties:
    goal:
      $ref: '#/DietGoal'
    age:
      type: integer
      nullable: true
      minimum: 1
      maximum: 120
    sex:
      $ref: '#/DietSex'
    height_cm:
      type: number
      format: double
      nullable: true
      minimum: 50
      maximum: 260
    weight_kg:
      type: number
      format: double
      nullable: true
      minimum: 20
      maximum: 400
    target_weight_kg:
      type: number
      format: double
      nullable: true
      minimum: 20
      maximum: 400
    activity_level:
      $ref: '#/DietActivityLevel'
    allergens:
      type: array
      description: 过敏原。命中即从推荐中剔除，不做降权处理。
      items:
        type: string
    dislikes:
      type: array
      description: 忌口。与过敏原同样是硬过滤，只是后果不同。
      items:
        type: string
    servings:
      type: integer
      description: 常规用餐人数，用于换算食材份量。
      minimum: 1
      maximum: 20
    max_cook_minutes:
      type: integer
      nullable: true
      minimum: 1
    budget:
      $ref: '#/DietBudget'
    tastes:
      type: array
      description: 口味偏好，例如「清淡」「辣」。用于排序，不是硬过滤。
      items:
        type: string
    equipment:
      type: array
      description: 家里有的厨具。缺少某道菜需要的厨具时降低它的优先级。
      items:
        type: string
    diagnosed_condition:
      type: boolean
      description: |
        用户自述已确诊相关疾病或正在用药。**只接受用户明确勾选**，不接受任何推断。
        为 true 时不生成治疗型菜单，并提示结合医生或营养师建议——
        这个产品不提供诊断、治疗承诺或用药建议。
    completed:
      type: boolean
      description: 是否完成过问卷。false 时客户端引导填写，但不阻止浏览菜谱。
    updated_at:
      type: string
      format: date-time

UpdateDietProfileRequest:
  type: object
  additionalProperties: false
  description: |
    只提交需要修改的字段；不传表示保持原值。
    清空一个可空字段必须把字段名放进 clear 数组，
    因为生成的 Go 类型无法区分“不传”与“传 null”。
  properties:
    clear:
      type: array
      items:
        type: string
        enum: [age, height_cm, weight_kg, target_weight_kg, max_cook_minutes]
    goal:
      $ref: '#/DietGoal'
    age:
      type: integer
      nullable: true
      minimum: 1
      maximum: 120
    sex:
      $ref: '#/DietSex'
    height_cm:
      type: number
      format: double
      nullable: true
      minimum: 50
      maximum: 260
    weight_kg:
      type: number
      format: double
      nullable: true
      minimum: 20
      maximum: 400
    target_weight_kg:
      type: number
      format: double
      nullable: true
      minimum: 20
      maximum: 400
    activity_level:
      $ref: '#/DietActivityLevel'
    allergens:
      type: array
      items:
        type: string
    dislikes:
      type: array
      items:
        type: string
    servings:
      type: integer
      minimum: 1
      maximum: 20
    max_cook_minutes:
      type: integer
      nullable: true
      minimum: 1
    budget:
      $ref: '#/DietBudget'
    tastes:
      type: array
      items:
        type: string
    equipment:
      type: array
      items:
        type: string
    diagnosed_condition:
      type: boolean
      description: 只接受用户明确勾选，不接受任何推断。
    completed:
      type: boolean

MealPlanEntry:
  type: object
  additionalProperties: false
  required: [date, meal_slot, recipe_id]
  properties:
    date:
      type: string
      format: date
      description: 该餐所在日期。用真实日期而不是“周几”，跨周与跨时区才不会含糊。
    meal_slot:
      $ref: '#/RecipeMealSlot'
    recipe_id:
      type: string
    recipe:
      description: 展开的菜谱，列表页据此显示菜名与营养，不用逐条再查。
      allOf:
        - $ref: '#/Recipe'

MealPlan:
  type: object
  additionalProperties: false
  description: |
    已确认的本周菜单。

    AI 生成的预览不在这里：规格 8.2.2 要求预览只是预览，
    用户点过“采用本周菜单”才算数，所以草稿留在客户端，不落库。
  required: [id, week_start, entries, planned_nutrition, created_at, updated_at, version]
  properties:
    id:
      type: string
      example: mpl_01J8Z3
    week_start:
      type: string
      format: date
      description: |
        本周第一天。由服务端按用户的 week_start 偏好计算，
        客户端不自行推导——周一还是周日开始是用户设置。
    entries:
      type: array
      items:
        $ref: '#/MealPlanEntry'
    planned_nutrition:
      description: |
        整周的**计划**摄入估算，由服务端按菜谱营养求和。
        它和用户实际记录的摄入是两回事，客户端不得混在一起展示。
      allOf:
        - $ref: '#/RecipeNutrition'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    version:
      type: integer

MealPlanEntryInput:
  type: object
  additionalProperties: false
  required: [date, meal_slot, recipe_id]
  properties:
    date:
      type: string
      format: date
    meal_slot:
      $ref: '#/RecipeMealSlot'
    recipe_id:
      type: string

ConfirmMealPlanRequest:
  type: object
  additionalProperties: false
  description: |
    采用一份菜单。整周一次性提交：菜单是一个整体，
    逐格增量提交会让“这周到底是哪一版”说不清楚。
  required: [week_start, entries]
  properties:
    week_start:
      type: string
      format: date
    entries:
      type: array
      description: 空数组表示清空本周菜单。
      items:
        $ref: '#/MealPlanEntryInput' 

ShoppingDraftItem:
  type: object
  additionalProperties: false
  description: 合并后的一项食材。合并与分类由服务端做，客户端不重算。
  required: [name, group, quantity_text, recipe_ids]
  properties:
    name:
      type: string
    group:
      $ref: '#/RecipeIngredientGroup'
    quantity_text:
      type: string
      description: |
        合并后的份量描述，例如“鸡蛋 6 个”。
        单位不一致时按原样并列，不硬凑成一个数——
        “2 个 + 少许”算不出一个准确总量，编一个反而误导。
    recipe_ids:
      type: array
      description: 这项食材来自哪几道菜，客户端据此显示来源。
      items:
        type: string

ShoppingDraft:
  type: object
  additionalProperties: false
  required: [week_start, items]
  properties:
    week_start:
      type: string
      format: date
    items:
      type: array
      items:
        $ref: '#/ShoppingDraftItem'

ShoppingListItemInput:
  type: object
  additionalProperties: false
  required: [name, quantity_text]
  properties:
    name:
      type: string
    quantity_text:
      type: string
    recipe_ids:
      type: array
      items:
        type: string

CreateShoppingListRequest:
  type: object
  additionalProperties: false
  description: |
    把选中的食材创建成正式购物清单（TaskList + Task）。
    用户排除家中已有食材之后才提交，服务端不替他决定买什么。
  required: [week_start, items]
  properties:
    week_start:
      type: string
      format: date
    list_name:
      type: string
      maxLength: 40
      description: 不传时服务端按周生成，例如“8月17日那周的采购”。
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/ShoppingListItemInput' 

DietProfileResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/DietProfile'
    meta:
      $ref: './common.yaml#/ResponseMeta'

MealPlanResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/MealPlan'
    meta:
      $ref: './common.yaml#/ResponseMeta'

ShoppingDraftResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/ShoppingDraft'
    meta:
      $ref: './common.yaml#/ResponseMeta'
