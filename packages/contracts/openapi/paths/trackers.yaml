# Tracker 与 Record。Record 的 values 必须满足所属 Tracker 的字段定义。

Collection:
  get:
    operationId: listTrackers
    summary: 读取全部 Tracker
    tags: [trackers]
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '../components/schemas/trackers.yaml#/TrackerStatus'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/TrackersResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: createTracker
    summary: 新建 Tracker
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/trackers.yaml#/CreateTrackerRequest'
    responses:
      '201':
        description: 创建成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/TrackerResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Item:
  get:
    operationId: getTracker
    summary: 读取 Tracker 详情
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/TrackerId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/TrackerResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateTracker
    summary: 修改 Tracker
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/TrackerId'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/trackers.yaml#/UpdateTrackerRequest'
    responses:
      '200':
        description: 修改成功。历史 Record 不被重写。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/TrackerResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    operationId: deleteTracker
    summary: 删除 Tracker
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/TrackerId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 删除成功。所属 Record 一并软删除。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

RecordCollection:
  get:
    operationId: listRecords
    summary: 查询 Record
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: tracker_id
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 按 timestamp 倒序返回。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/RecordsResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: createRecord
    summary: 新建 Record
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/trackers.yaml#/CreateRecordRequest'
    responses:
      '201':
        description: 创建成功。title 由服务端生成。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/RecordResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

RecordItem:
  get:
    operationId: getRecord
    summary: 读取 Record 详情
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/RecordId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/RecordResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateRecord
    summary: 修改 Record
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/RecordId'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/trackers.yaml#/UpdateRecordRequest'
    responses:
      '200':
        description: 修改成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/RecordResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    operationId: deleteRecord
    summary: 删除 Record
    tags: [trackers]
    parameters:
      - $ref: '../components/parameters.yaml#/RecordId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 删除成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
