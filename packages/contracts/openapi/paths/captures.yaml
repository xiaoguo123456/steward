# 统一 Capture 输入、解析、追问与确认。

Collection:
  post:
    operationId: createCapture
    summary: 提交一次 Capture 输入
    description: |
      同步创建 Capture 并返回 202 与 operation_id，解析在 Worker 中异步执行。
      客户端通过 Operation 轮询处理进度，成功后读取 Capture 获取候选。
    tags: [captures]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/captures.yaml#/CreateCaptureRequest'
    responses:
      '202':
        description: 已受理，解析任务已入队。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/AcceptedResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Item:
  get:
    operationId: getCapture
    summary: 读取 Capture 状态与候选
    tags: [captures]
    parameters:
      - $ref: '../components/parameters.yaml#/CaptureId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/captures.yaml#/CaptureResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    operationId: discardCapture
    summary: 放弃本次 Capture
    tags: [captures]
    parameters:
      - $ref: '../components/parameters.yaml#/CaptureId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 已放弃。未确认候选不会进入任何正式列表。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Confirm:
  post:
    operationId: confirmCapture
    summary: 确认并保存本次 Capture 的候选项
    description: |
      一次确认中的 Tracker、Object 创建、已有实体更新与 Relation 变更以事务方式保存，
      任一操作失败时整体回滚。重复提交同一 Idempotency-Key 不会创建重复实体。
    tags: [captures]
    parameters:
      - $ref: '../components/parameters.yaml#/CaptureId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/captures.yaml#/ConfirmCaptureRequest'
    responses:
      '200':
        description: 保存成功，返回本次影响的资源与撤销入口。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/captures.yaml#/ConfirmCaptureResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Questions:
  get:
    operationId: listCaptureQuestions
    summary: 读取全局待答问题
    description: 全局 AI 待答入口的权威数据源。App 按 ID 读取，不复制问题正文到全局状态。
    tags: [captures]
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [open, answered, superseded, expired]
          default: open
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/captures.yaml#/CaptureQuestionsResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

QuestionAnswer:
  post:
    operationId: answerCaptureQuestion
    summary: 回答一个待答问题
    description: 由 Captures 创建新 revision 并返回 Operation，通用 Assistant 不直接修改旧候选。
    tags: [captures]
    parameters:
      - $ref: '../components/parameters.yaml#/QuestionId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/captures.yaml#/AnswerCaptureQuestionRequest'
    responses:
      '202':
        description: 已受理，新的解析任务已入队。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/AcceptedResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
