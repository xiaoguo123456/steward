# 聚合读模型入口：Today、日历、周复盘与搜索。

Today:
  get:
    operationId: getToday
    summary: 读取今天的任务与日程
    description: |
      收录与排序完全由服务端确定性代码计算，客户端不得重排。
      展开只改变客户端可见数量，不改变收录、排序或字段。
    tags: [views]
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/TodayViewResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Calendar:
  get:
    operationId: getCalendar
    summary: 按日期范围读取日历
    tags: [views]
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        description: 与 from 的跨度不得超过 100 天。
        schema:
          type: string
          format: date
      - name: project_id
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/CalendarViewResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

WeeklyReview:
  get:
    operationId: getWeeklyReview
    summary: 读取某一周的复盘
    description: |
      确定性指标始终可用。AI 叙述与建议在 Provider 不可用时为空，
      页面仍然展示指标与来源。
    tags: [views]
    parameters:
      - name: week_of
        in: query
        required: false
        description: 该周内任意一天的当地日期。不传时为本周。
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/WeeklyReviewResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Search:
  get:
    operationId: search
    summary: 跨实体关键词检索
    description: 只返回已确认的正式内容，处理中或待确认的 Capture 不会出现。
    tags: [views]
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '../components/schemas/common.yaml#/ObjectType'
        style: form
        explode: false
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/SearchResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

GenerateWeeklyReview:
  post:
    operationId: generateWeeklyReview
    summary: 生成本周复盘的叙述与建议
    description: |
      返回 202 与 operation_id，叙述在 Worker 中异步生成。
      确定性指标不依赖这一步：即使生成失败，复盘页仍然完整可用。
      没有来源支撑的结论会被丢弃，不会出现在建议里。
    tags: [views]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              week_of:
                type: string
                format: date
                nullable: true
                description: 该周内任意一天的当地日期。不传时为本周。
    responses:
      '202':
        description: 已受理。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/AcceptedResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

ImportantDates:
  get:
    operationId: getImportantDates
    summary: 读取重要日及其下一次发生日期
    description: |
      重要日复用 event_kind=important_date 的全天 Event，这里只做投影与排序。
      年度投影、2 月 29 日与时区换算都由服务端确定性代码计算，客户端不得重排。
      今天和未来条目优先且按发生日期升序；已过期的一次性条目放在其后，
      按最近过期优先。客户端可按 days_until 分区，但保留组内顺序。
      新增与修改仍然走普通的 Event 接口。
    tags: [views]
    parameters:
      - name: limit
        in: query
        required: false
        description: 最多返回多少条，默认 50。
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/ImportantDatesResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

ProjectItinerary:
  get:
    operationId: getProjectItinerary
    summary: 读取一个项目的行程聚合
    description: |
      行程复用 Project 组织 Event、Task 与 Note，不创建新的 Trip 对象。
      按天分组与日期范围由服务端按用户时区计算，客户端不重排。
    tags: [views]
    parameters:
      - $ref: '../components/parameters.yaml#/ProjectId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/ProjectItineraryResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

PendingReminders:
  get:
    operationId: listPendingReminders
    summary: 查询此刻该提醒的事
    description: |
      每次现算：用户改了时区、改了截止日期、把事项删了，结果立刻跟着变。

      只返回已经到点、且事件本身还没过去太久的提醒。窗口按事件算而不是
      按提醒响的时刻算——一条「提前 7 天」的提醒响过 5 天时，事件可能
      还有两天才到，那正是最该看到它的时候。
    tags: [views]
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/views.yaml#/PendingRemindersResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: dismissReminder
    summary: 消掉一条提醒
    description: 消掉之后这一次发生不再浮出来。重复提交同一条不报错。
    tags: [views]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/views.yaml#/DismissReminderRequest'
    responses:
      '200':
        description: 已消掉。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
