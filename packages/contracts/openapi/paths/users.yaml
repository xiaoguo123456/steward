# 当前用户资料、显式偏好与 AI 开关。

Me:
  get:
    operationId: getCurrentUser
    summary: 读取当前用户资料
    tags: [users]
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/account.yaml#/UserResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateCurrentUser
    summary: 修改当前用户资料
    tags: [users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/account.yaml#/UpdateUserRequest'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/account.yaml#/UserResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

