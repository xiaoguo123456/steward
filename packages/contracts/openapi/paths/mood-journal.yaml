EntryCollection:
  get:
    operationId: listMoodJournalEntries
    summary: 查询心情日记
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: q
        in: query
        schema:
          type: string
    responses:
      '200':
        description: 按实际发生时间倒序返回。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalEntriesResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: createMoodJournalEntry
    summary: 新建心情日记
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/mood-journal.yaml#/CreateMoodJournalEntryRequest'
    responses:
      '201':
        description: 创建成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalEntryResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

EntryItem:
  parameters:
    - name: entry_id
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: getMoodJournalEntry
    summary: 读取心情日记
    tags: [mood-journal]
    responses:
      '200':
        description: 读取成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalEntryResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateMoodJournalEntry
    summary: 修改心情日记
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/mood-journal.yaml#/UpdateMoodJournalEntryRequest'
    responses:
      '200':
        description: 修改成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalEntryResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    operationId: deleteMoodJournalEntry
    summary: 删除心情日记
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 删除成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Polish:
  post:
    operationId: polishMoodJournalDraft
    summary: AI 排版润色心情日记草稿
    description: |
      对当前用户主动提交的 blocks_v1 草稿做一次结构化排版润色。
      结果只返回编辑器，不创建或修改日记；用户仍需检查并点击保存。
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/mood-journal.yaml#/MoodJournalPolishRequest'
    responses:
      '200':
        description: 返回待用户检查的结构化润色结果。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalPolishResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

Calendar:
  get:
    operationId: getMoodJournalCalendar
    summary: 查询心情日记日历
    tags: [mood-journal]
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 返回有日记的日期与篇数。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalCalendarResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Statistics:
  get:
    operationId: getMoodJournalStatistics
    summary: 查询心情日记确定性统计
    tags: [mood-journal]
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 返回确定性篇数、书写天数、心情分布和常用感受词。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalStatisticsResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

FollowUp:
  parameters:
    - name: entry_id
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: generateMoodJournalFollowUp
    summary: 生成单篇日记保存后追问
    description: |
      用户保存后主动选择继续思考时调用。只发送当前日记的纯文本投影；结果是可跳过的只读候选，不修改日记。
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 返回一个温和追问。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalFollowUpResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

Reflections:
  post:
    operationId: generateMoodJournalReflection
    summary: 生成周或月心情回望候选
    description: |
      仅使用用户本次明确选择、属于日期范围且未排除 AI 的日记纯文本投影。结果不自动保存、不写入 Note 或 Memory。
    tags: [mood-journal]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/mood-journal.yaml#/MoodJournalReflectionRequest'
    responses:
      '200':
        description: 返回带来源引用的回望候选。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/mood-journal.yaml#/MoodJournalReflectionResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
