# Assistant 对话与 Action Proposal。

Threads:
  get:
    operationId: listThreads
    summary: 读取对话列表
    description: 只返回真正说过话的对话；没有消息的空对话不出现在历史里。
    tags: [assistant]
    parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: 按更新时间倒序返回。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/AssistantThreadsResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: createThread
    summary: 开始一次对话
    description: |
      客户端应当在用户真正发出第一条消息时才调用它：
      打开面板就建对话会在历史里堆一串没有内容的空壳。
      最近一次对话仍在续用窗口内时直接返回那一次，除非显式要求新建。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/assistant.yaml#/CreateThreadRequest'
    responses:
      '201':
        description: 创建成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/AssistantThreadResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Thread:
  get:
    operationId: getThread
    summary: 读取对话摘要
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ThreadId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/AssistantThreadResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateThread
    summary: 修改标题或归档状态
    description: 归档只影响默认列表展示，不会让待确认建议自动执行。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ThreadId'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/assistant.yaml#/UpdateThreadRequest'
    responses:
      '200':
        description: 修改成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/AssistantThreadResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    operationId: deleteThread
    summary: 删除对话内容
    description: |
      按保留策略清理消息与派生摘要。
      已经执行的业务实体及其 Activity 不随对话删除。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ThreadId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 删除成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/envelopes.yaml#/MutationResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Messages:
  get:
    operationId: listMessages
    summary: 读取对话消息
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ThreadId'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: 按序号倒序返回。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/AssistantMessagesResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Turns:
  post:
    operationId: createTurn
    summary: 发送一条消息并触发回复
    description: |
      同步保存用户消息并返回 202 与 operation_id，回复在 Worker 中异步生成。
      客户端通过 Operation 轮询，完成后读取消息列表。

      想要逐字体验时，可以另外连接
      `GET /v1/assistant/turns/{turn_id}/stream`（SSE，帧结构见
      TurnStreamEvent）。它只是传输方式，不是新的权威状态源：
      连不上或中途断开时退回轮询即可，不会丢内容。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ThreadId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/assistant.yaml#/CreateTurnRequest'
    responses:
      '202':
        description: 已受理，回复任务已入队。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/TurnAcceptedResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

CancelTurn:
  post:
    operationId: cancelTurn
    summary: 取消仍在执行的回复
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/TurnId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 已请求取消。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/EmptyResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Proposals:
  get:
    operationId: listProposals
    summary: 读取待确认与历史建议
    tags: [assistant]
    parameters:
      - name: status
        in: query
        required: false
        description: 不传时只返回待确认项。
        schema:
          type: array
          items:
            $ref: '../components/schemas/assistant.yaml#/ProposalStatus'
        style: form
        explode: false
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/ActionProposalsResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Proposal:
  get:
    operationId: getProposal
    summary: 读取建议详情
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ProposalId'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/ActionProposalResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

ConfirmProposal:
  post:
    operationId: confirmProposal
    summary: 确认并执行建议
    description: |
      服务端会重新读取目标、重新执行权限与状态机校验，再把允许的用户编辑
      映射成类型化 Domain Command 执行。模型给出的理由不能替代这一步。
      目标在建议生成后被改动过时返回 AI_PROPOSAL_STALE。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ProposalId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/assistant.yaml#/ConfirmProposalRequest'
    responses:
      '200':
        description: 执行成功，返回受影响资源与撤销入口。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/ConfirmProposalResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

RejectProposal:
  post:
    operationId: rejectProposal
    summary: 拒绝建议
    description: 不修改任何业务数据。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/ProposalId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: 已拒绝。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/assistant.yaml#/ActionProposalResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

TurnStream:
  get:
    operationId: streamTurn
    summary: 订阅回复的实时进度
    description: |
      SSE 长连接。它只是传输方式，不是新的权威状态源：
      连不上、中途断开或事件丢失都不影响正确性，客户端读 Message
      与 Operation 就能恢复全貌，也可以完全不用它、只轮询 Operation。

      服务端实现挂在传输层而不是生成的 strict server 上：
      后者给不出可以持续 flush 的写入口。这一条与本地存储的传输端点同理。
    tags: [assistant]
    parameters:
      - $ref: '../components/parameters.yaml#/TurnId'
    responses:
      '200':
        description: |
          事件流。每帧一个 TurnStreamEvent；
          收到 done 或 error 后连接结束。
        content:
          text/event-stream:
            schema:
              $ref: '../components/schemas/assistant.yaml#/TurnStreamEvent'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '503':
        description: 同时打开的流已达上限，请退回轮询。
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
