openapi: 3.0.3

info:
  title: AI事管家 后台管理 API
  version: 0.1.0
  description: |
    后台管理接口。**与公共 API 完全分开**：独立进程、独立端口、
    独立域名、独立 Cookie、独立数据库账号、独立契约。

    分开不是为了整洁，是为了让「普通用户能不能碰到后台」这个问题
    有一个结构性的答案：碰不到，因为根本不在同一个进程上。

    ## 数据边界

    后台**不返回任何用户正文**——笔记、会话消息、记忆、OCR 结果、
    转写文字、媒体内容一律不出现在任何响应里。能看到的是状态、
    数量、标识符和统计。

    跨用户的列表与统计走 `admin` schema 里的脱敏读模型；
    单用户详情在该用户的 RLS 事务里执行，一次事务只绑一个用户。
    Admin 的数据库账号是 NOBYPASSRLS 的，**它绕不过行级安全**，
    这条由集成测试守着。

servers:
  - url: http://localhost:8788
    description: 本地开发

tags:
  - name: admin-auth
    description: 登录与会话
  - name: admin-dashboard
    description: 总览
  - name: admin-users
    description: 用户查询与管理
  - name: admin-usage
    description: 使用分析
  - name: admin-costs
    description: AI 成本
  - name: admin-ops
    description: 运行中心
  - name: admin-audit
    description: 操作审计
  - name: admin-dashboard
    description: 总览
  - name: admin-users
    description: 用户查询与管理
  - name: admin-usage
    description: 使用分析
  - name: admin-costs
    description: AI 成本
  - name: admin-ops
    description: 运行中心
  - name: admin-audit
    description: 操作审计

security:
  - adminSession: []

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: steward_admin_session
      description: |
        HttpOnly Cookie。Secure、SameSite=Strict、Path=/。
        写请求另外要求 X-Admin-CSRF 与 Origin 校验。

paths:
  /admin/v1/login:
    $ref: './paths/auth.yaml#/Login'
  /admin/v1/session:
    $ref: './paths/auth.yaml#/Session'
  /admin/v1/logout:
    $ref: './paths/auth.yaml#/Logout'
  /admin/v1/dashboard/summary:
    $ref: './paths/read.yaml#/DashboardSummary'
  /admin/v1/dashboard/trends:
    $ref: './paths/read.yaml#/DashboardTrends'
  /admin/v1/users:
    $ref: './paths/read.yaml#/Users'
  /admin/v1/users/{user_id}:
    $ref: './paths/read.yaml#/UserDetail'
  /admin/v1/users/{user_id}/usage:
    $ref: './paths/read.yaml#/UserUsage'
  /admin/v1/users/{user_id}/costs:
    $ref: './paths/read.yaml#/UserCosts'
  /admin/v1/users/{user_id}/operations:
    $ref: './paths/read.yaml#/UserOperations'
  /admin/v1/users/{user_id}/admin-actions:
    $ref: './paths/read.yaml#/UserAdminActions'
  /admin/v1/usage/overview:
    $ref: './paths/read.yaml#/UsageOverview'
  /admin/v1/usage/funnels/{funnel}:
    $ref: './paths/read.yaml#/Funnel'
  /admin/v1/ai-costs/summary:
    $ref: './paths/read.yaml#/AICostSummary'
  /admin/v1/ai-costs/breakdown:
    $ref: './paths/read.yaml#/AICostBreakdown'
  /admin/v1/queues:
    $ref: './paths/read.yaml#/Queues'
  /admin/v1/providers:
    $ref: './paths/read.yaml#/Providers'
  /admin/v1/operations:
    $ref: './paths/read.yaml#/Operations'
  /admin/v1/audit-logs:
    $ref: './paths/read.yaml#/AuditLogs'
