        $ref: '../components/responses.yaml#/InternalError'

Users:
  get:
    operationId: adminListUsers
    summary: 用户列表
    description: |
      读的是脱敏读模型，不是业务表。**手机号只能精确查，不支持模糊搜索**：
      模糊搜索等于给了一个把号码一位位试出来的接口。
    tags: [admin-users]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/UserStatusFilter'
      - $ref: '../components/parameters.yaml#/InitializedFilter'
      - $ref: '../components/parameters.yaml#/UserIDFilter'
      - $ref: '../components/parameters.yaml#/PhoneFilter'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/users.yaml#/AdminUserListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

