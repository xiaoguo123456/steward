# 后台只读接口。全部不返回任何用户正文。

DashboardSummary:
  get:
    operationId: adminDashboardSummary
    summary: 总览
    description: |
      各模块独立取数。**某个数据源失败时保留其他模块**并在 failed_sections 里标出来——
      一个模块查不出来，不该让运营连用户数都看不到。
    tags: [admin-dashboard]
    parameters:
      - $ref: '../components/parameters.yaml#/RangeFrom'
      - $ref: '../components/parameters.yaml#/RangeTo'
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/dashboard.yaml#/DashboardSummaryResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

