Login:
  post:
    operationId: adminLogin
    summary: 管理员登录
    description: |
      仅数据库管理员名单中的启用账号可登录。短信验证和密码验证均独立于 App。
      首次短信验证成功但尚未设置密码时返回 428，不创建后台会话。
      客户端补充 new_password 后提交原挑战；已有密码不能通过登录请求覆盖。
      统一校验 Origin、手机号与来源限流，成功后下发 HttpOnly Cookie。
    tags: [admin-auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: 登录成功。
        content:
          application/json:
            schema:
              $ref: '../components/auth.yaml#/LoginResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '428':
        description: 验证码有效，请设置首次登录密码。
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Session:
  get:
    operationId: adminGetSession
    summary: 读取当前会话
    description: 前端启动时用它判断是否已登录，并取回 CSRF Token 与报表时区。
    tags: [admin-auth]
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: '../components/auth.yaml#/SessionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

Logout:
  post:
    operationId: adminLogout
    summary: 退出并撤销会话
    tags: [admin-auth]
    parameters:
      - $ref: '../components/parameters.yaml#/CSRFToken'
    responses:
      '200':
        description: 已退出。
        content:
          application/json:
            schema:
              $ref: '../components/auth.yaml#/LogoutResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

PhoneCode:
  post:
    operationId: adminRequestPhoneCode
    summary: 发送后台专用验证码
    tags: [admin-auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth.yaml#/PhoneCodeRequest'
    responses:
      '200':
        description: 请求已处理，验证码仅向已授权号码发送；密码重设后需重新登录。
        content:
          application/json:
            schema:
              $ref: '../components/auth.yaml#/PhoneCodeResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

PasswordReset:
  post:
    operationId: adminResetPassword
    summary: 通过专用验证码重设密码并撤销所有旧会话
    tags: [admin-auth]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth.yaml#/PasswordResetRequest'
    responses:
      '200':
        description: 请求已处理，验证码仅向已授权号码发送；密码重设后需重新登录。
        content:
          application/json:
            schema:
              $ref: '../components/auth.yaml#/LogoutResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
