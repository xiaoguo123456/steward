LoginRequest:
  type: object
  additionalProperties: false
  required: [phone, method]
  properties:
    phone:
      type: string
      pattern: '^1[3-9][0-9]{9}$'
      maxLength: 11
    method:
      type: string
      enum: [password, sms]
    password:
      type: string
      maxLength: 128
      format: password
    challenge_id:
      type: string
      maxLength: 64
    code:
      type: string
      pattern: '^[0-9]{6}$'
    new_password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      description: 首次短信验证通过后设置密码；已有密码时不可通过登录请求修改。

PhoneCodeRequest:
  type: object
  additionalProperties: false
  required: [phone, purpose, consent_accepted]
  properties:
    phone:
      type: string
      pattern: '^1[3-9][0-9]{9}$'
      maxLength: 11
    purpose:
      type: string
      enum: [login, password_reset]
    consent_accepted:
      type: boolean
      enum: [true]

PhoneCodeResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in_seconds, resend_after_seconds]
      properties:
        challenge_id: { type: string }
        expires_in_seconds: { type: integer }
        resend_after_seconds: { type: integer }
    meta:
      $ref: './common.yaml#/ResponseMeta'

PasswordResetRequest:
  type: object
  additionalProperties: false
  required: [phone, challenge_id, code, new_password]
  properties:
    phone:
      type: string
      pattern: '^1[3-9][0-9]{9}$'
      maxLength: 11
    challenge_id: { type: string, maxLength: 64 }
    code:
      type: string
      pattern: '^[0-9]{6}$'
    new_password:
      type: string
      minLength: 12
      maxLength: 128
      format: password

LoginResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/AdminSession'
    meta:
      $ref: './common.yaml#/ResponseMeta'

AdminSession:
  type: object
  additionalProperties: false
  description: |
    当前会话。**Session Token 不在这里**——它只走 HttpOnly Cookie，
    任何能被 JavaScript 读到的地方都不放，否则一次 XSS 就等于拿到后台。

    csrf_token 反过来必须能被 JavaScript 读到：写请求要把它放进请求头，
    这正是它能防住跨站请求的原因（跨站脚本读不到响应体）。
  required: [username, csrf_token, expires_at, absolute_expires_at, environment, reporting_timezone]
  properties:
    username:
      type: string
    csrf_token:
      type: string
    expires_at:
      type: string
      format: date-time
      description: 空闲超时时刻，每次请求都会往后推。
    absolute_expires_at:
      type: string
      format: date-time
      description: 绝对超时时刻，不随请求延长。
    environment:
      type: string
      description: 非 production 时界面上常驻显示，避免在生产上误操作。
    reporting_timezone:
      type: string
      description: 后台报表按这个时区切日，所有日期口径以它为准。

SessionResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/AdminSession'
    meta:
      $ref: './common.yaml#/ResponseMeta'

LogoutResponse:
  type: object
  additionalProperties: false
  required: [meta]
  properties:
    meta:
      $ref: './common.yaml#/ResponseMeta'
