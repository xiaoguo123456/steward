openapi: 3.0.3
info:
  title: AI事管家 后台管理 API
  version: 0.1.0
  description: |
    后台管理接口。**与公共 API 完全分开**：独立进程、独立端口、
    独立域名、独立 Cookie、独立数据库账号、独立契约。

    分开不是为了整洁，是为了让「普通用户能不能碰到后台」这个问题
    有一个结构性的答案：碰不到，因为根本不在同一个进程上。

    ## 数据边界

    后台**不返回任何用户正文**——笔记、会话消息、记忆、OCR 结果、
    转写文字、媒体内容一律不出现在任何响应里。能看到的是状态、
    数量、标识符和统计。

    跨用户的列表与统计走 `admin` schema 里的脱敏读模型；
    单用户详情在该用户的 RLS 事务里执行，一次事务只绑一个用户。
    Admin 的数据库账号是 NOBYPASSRLS 的，**它绕不过行级安全**，
    这条由集成测试守着。
servers:
  - url: http://localhost:8788
    description: 本地开发
security:
  - adminSession: []
tags:
  - name: admin-auth
    description: 登录与会话
paths:
  /admin/v1/login:
    post:
      operationId: adminLogin
      summary: 管理员登录
      description: |
        校验 Origin 与限流，再比对 Argon2id 口令散列。成功后下发
        HttpOnly Cookie，并在响应体里返回 CSRF Token。

        失败一律返回同一个 ADMIN_LOGIN_INVALID，**不区分「用户名不存在」
        与「密码不对」**：区分开等于告诉攻击者用户名猜对了。
      tags:
        - admin-auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/session:
    get:
      operationId: adminGetSession
      summary: 读取当前会话
      description: 前端启动时用它判断是否已登录，并取回 CSRF Token 与报表时区。
      tags:
        - admin-auth
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/logout:
    post:
      operationId: adminLogout
      summary: 退出并撤销会话
      tags:
        - admin-auth
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 已退出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: steward_admin_session
      description: |
        HttpOnly Cookie。Secure、SameSite=Strict、Path=/。
        写请求另外要求 X-Admin-CSRF 与 Origin 校验。
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
    AdminSession:
      type: object
      additionalProperties: false
      description: |
        当前会话。**Session Token 不在这里**——它只走 HttpOnly Cookie，
        任何能被 JavaScript 读到的地方都不放，否则一次 XSS 就等于拿到后台。

        csrf_token 反过来必须能被 JavaScript 读到：写请求要把它放进请求头，
        这正是它能防住跨站请求的原因（跨站脚本读不到响应体）。
      required:
        - username
        - csrf_token
        - expires_at
        - absolute_expires_at
        - environment
        - reporting_timezone
      properties:
        username:
          type: string
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: 空闲超时时刻，每次请求都会往后推。
        absolute_expires_at:
          type: string
          format: date-time
          description: 绝对超时时刻，不随请求延长。
        environment:
          type: string
          description: 非 production 时界面上常驻显示，避免在生产上误操作。
        reporting_timezone:
          type: string
          description: 后台报表按这个时区切日，所有日期口径以它为准。
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: 出错时报给用户的定位依据，日志里按它能查到整条调用链。
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSession'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorCode:
      type: string
      enum:
        - ADMIN_AUTH_REQUIRED
        - ADMIN_LOGIN_INVALID
        - ADMIN_SESSION_EXPIRED
        - ADMIN_CSRF_INVALID
        - ADMIN_RATE_LIMITED
        - ADMIN_IDEMPOTENCY_KEY_REQUIRED
        - ADMIN_IDEMPOTENCY_KEY_REUSED
        - ADMIN_VERSION_CONFLICT
        - ADMIN_REASON_REQUIRED
        - ADMIN_USER_NOT_FOUND
        - ADMIN_USER_STATUS_CONFLICT
        - ADMIN_PRICING_MISSING
        - ADMIN_AUDIT_WRITE_FAILED
        - ADMIN_VALIDATION_FAILED
        - ADMIN_INTERNAL_ERROR
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AdminSession'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    LogoutResponse:
      type: object
      additionalProperties: false
      required:
        - meta
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    BadRequest:
      description: 参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        未登录或会话已失效。

        Cache-Control 由中间件统一设置（private, no-store），
        不在每个响应上重复声明——重复声明只会让生成的类型多一层包装。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF 或 Origin 校验未通过。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过于频繁。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    CSRFToken:
      name: X-Admin-CSRF
      in: header
      required: true
      description: 登录时下发，写操作必带。与 Origin 校验一起用，单靠任何一个都不够。
      schema:
        type: string
