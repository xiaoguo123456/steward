openapi: 3.0.3
info:
  title: 序事后台管理 API
  version: 0.1.0
  description: |
    后台管理接口。**与公共 API 完全分开**：独立进程、独立端口、
    独立域名、独立 Cookie、独立数据库账号、独立契约。

    分开不是为了整洁，是为了让「普通用户能不能碰到后台」这个问题
    有一个结构性的答案：碰不到，因为根本不在同一个进程上。

    ## 数据边界

    后台**不返回任何用户正文**——笔记、会话消息、记忆、OCR 结果、
    转写文字、媒体内容一律不出现在任何响应里。能看到的是状态、
    数量、标识符和统计。

    跨用户的列表与统计走 `admin` schema 里的脱敏读模型；
    单用户详情在该用户的 RLS 事务里执行，一次事务只绑一个用户。
    Admin 的数据库账号是 NOBYPASSRLS 的，**它绕不过行级安全**，
    这条由集成测试守着。
servers:
  - url: http://localhost:8788
    description: 本地开发
security:
  - adminSession: []
tags:
  - name: admin-auth
    description: 登录与会话
  - name: admin-dashboard
    description: 总览
  - name: admin-users
    description: 用户查询与管理
  - name: admin-usage
    description: 使用分析
  - name: admin-costs
    description: AI 成本
  - name: admin-ops
    description: 运行中心
  - name: admin-audit
    description: 操作审计
paths:
  /admin/v1/login:
    post:
      operationId: adminLogin
      summary: 管理员登录
      description: |
        校验 Origin 与限流，再比对 Argon2id 口令散列。成功后下发
        HttpOnly Cookie，并在响应体里返回 CSRF Token。

        失败一律返回同一个 ADMIN_LOGIN_INVALID，**不区分「用户名不存在」
        与「密码不对」**：区分开等于告诉攻击者用户名猜对了。
      tags:
        - admin-auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/session:
    get:
      operationId: adminGetSession
      summary: 读取当前会话
      description: 前端启动时用它判断是否已登录，并取回 CSRF Token 与报表时区。
      tags:
        - admin-auth
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/logout:
    post:
      operationId: adminLogout
      summary: 退出并撤销会话
      tags:
        - admin-auth
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 已退出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/dashboard/summary:
    get:
      operationId: adminDashboardSummary
      summary: 总览
      description: |
        各模块独立取数。**某个数据源失败时保留其他模块**并在 failed_sections 里标出来——
        一个模块查不出来，不该让运营连用户数都看不到。
      tags:
        - admin-dashboard
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/dashboard/trends:
    get:
      operationId: adminDashboardTrends
      summary: 总览趋势
      tags:
        - admin-dashboard
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrendsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users:
    get:
      operationId: adminListUsers
      summary: 用户列表
      description: |
        读的是脱敏读模型，不是业务表。**手机号只能精确查，不支持模糊搜索**：
        模糊搜索等于给了一个把号码一位位试出来的接口。
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserStatusFilter'
        - $ref: '#/components/parameters/InitializedFilter'
        - $ref: '#/components/parameters/UserIDFilter'
        - $ref: '#/components/parameters/PhoneFilter'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}:
    get:
      operationId: adminGetUser
      summary: 用户概览
      description: |
        只返回状态、数量与标识。**不返回笔记、会话消息、记忆、OCR 结果或媒体正文。**
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/usage:
    get:
      operationId: adminGetUserUsage
      summary: 用户使用情况
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/costs:
    get:
      operationId: adminGetUserCosts
      summary: 用户 AI 成本
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/operations:
    get:
      operationId: adminGetUserOperations
      summary: 用户 Operation
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOperationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/admin-actions:
    get:
      operationId: adminGetUserAdminActions
      summary: 用户管理记录
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/usage/overview:
    get:
      operationId: adminUsageOverview
      summary: 使用概览
      tags:
        - admin-usage
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/usage/funnels/{funnel}:
    get:
      operationId: adminGetFunnel
      summary: 漏斗
      description: |
        分母为 0 时转化率返回空，界面显示“—”**而不是 0%**：
        没有样本和转化率为零是两回事。
      tags:
        - admin-usage
      parameters:
        - $ref: '#/components/parameters/FunnelName'
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/ai-costs/summary:
    get:
      operationId: adminAICostSummary
      summary: AI 成本汇总
      tags:
        - admin-costs
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICostSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/ai-costs/breakdown:
    get:
      operationId: adminAICostBreakdown
      summary: AI 成本分组
      tags:
        - admin-costs
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
        - $ref: '#/components/parameters/GroupBy'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICostBreakdownResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/queues:
    get:
      operationId: adminGetQueues
      summary: Queue 状态
      tags:
        - admin-ops
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/providers:
    get:
      operationId: adminGetProviders
      summary: Provider 状态
      tags:
        - admin-ops
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/operations:
    get:
      operationId: adminListOperations
      summary: Operation 列表
      tags:
        - admin-ops
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OperationStatusFilter'
        - $ref: '#/components/parameters/UserIDFilter'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOperationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/audit-logs:
    get:
      operationId: adminListAuditLogs
      summary: 操作审计
      tags:
        - admin-audit
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ActionFilter'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/suspensions:
    post:
      operationId: adminSuspendUser
      summary: 暂停用户
      description: |
        只允许 active → suspended。同时撤销该用户全部登录会话——
        **暂停但不踢下线等于没暂停**：他手里的令牌还能继续用到过期。
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: 已暂停。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/resumptions:
    post:
      operationId: adminResumeUser
      summary: 恢复用户
      description: |
        只允许 suspended → active。

        **不恢复旧会话，也不重放暂停期间失败的任务。**
        旧会话是暂停时主动撤销的，恢复账号不等于恢复那些令牌；
        重放任务则可能在用户毫不知情的时候产生一批新数据。
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: 已恢复。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/session-revocations:
    post:
      operationId: adminRevokeUserSessions
      summary: 撤销用户会话
      description: 撤销该用户全部有效会话。不改变账号状态。
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: 已撤销。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/users/{user_id}/ai-budget:
    put:
      operationId: adminSetUserBudget
      summary: 设置用户 AI 预算
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBudgetRequest'
      responses:
        '200':
          description: 已设置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminClearUserBudget
      summary: 清除用户 AI 预算
      tags:
        - admin-users
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 已清除。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/ai-prices:
    get:
      operationId: adminListAIPrices
      summary: AI 价格列表
      tags:
        - admin-costs
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPriceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreateAIPrice
      summary: 新增价格版本
      description: |
        新增一个版本，**不覆盖旧值**：覆盖会让上个月的报表这个月一看变了数。
        同一服务商、模型与用量单位的生效区间不允许重叠。
      tags:
        - admin-costs
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAIPriceRequest'
      responses:
        '200':
          description: 已新增。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPriceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: steward_admin_session
      description: |
        HttpOnly Cookie。Secure、SameSite=Strict、Path=/。
        写请求另外要求 X-Admin-CSRF 与 Origin 校验。
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
    AdminSession:
      type: object
      additionalProperties: false
      description: |
        当前会话。**Session Token 不在这里**——它只走 HttpOnly Cookie，
        任何能被 JavaScript 读到的地方都不放，否则一次 XSS 就等于拿到后台。

        csrf_token 反过来必须能被 JavaScript 读到：写请求要把它放进请求头，
        这正是它能防住跨站请求的原因（跨站脚本读不到响应体）。
      required:
        - username
        - csrf_token
        - expires_at
        - absolute_expires_at
        - environment
        - reporting_timezone
      properties:
        username:
          type: string
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: 空闲超时时刻，每次请求都会往后推。
        absolute_expires_at:
          type: string
          format: date-time
          description: 绝对超时时刻，不随请求延长。
        environment:
          type: string
          description: 非 production 时界面上常驻显示，避免在生产上误操作。
        reporting_timezone:
          type: string
          description: 后台报表按这个时区切日，所有日期口径以它为准。
