            - storage
            - sms
        calls_24h:
          type: integer
        success_rate:
          type: number
          format: double
          nullable: true
        error_rate:
          type: number
          format: double
          nullable: true
        rate_limited_rate:
          type: number
          format: double
          nullable: true
        p95_latency_ms:
          type: integer
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
    ProviderStatusResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ReasonCode:
      type: string
      enum:
        - abuse_prevention
        - payment_issue
        - user_request
        - security_incident
        - support_investigation
        - other
    AdminActionRequest:
      type: object
      additionalProperties: false
      description: |
        管理操作的公共入参。

        三样都是必填，各有各的理由：

        - `expected_version` 是乐观锁。两个运营看着同一个用户各点各的时，
          后一个会拿到冲突而不是**悄悄覆盖掉前一个的决定**。
        - `reason_code` 让处置能被归类统计。
        - `reason_text` 让三个月后的人看得懂当时为什么这么做。

        没有理由的处置等于没有记录——事后没人能判断那次操作是否恰当。
      required:
        - expected_version
        - reason_code
        - reason_text
      properties:
        expected_version:
          type: integer
          minimum: 0
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
        reason_text:
          type: string
          minLength: 4
          maxLength: 500
          description: 具体说明。**不要写用户的原话**——那是他的资料，不是处置依据。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 处置的结束时间。不填表示长期有效。
    SuspendResult:
      type: object
      additionalProperties: false
      required:
        - user_id
        - account_status
        - version
        - revoked_sessions
        - audit_log_id
      properties:
        user_id:
          type: string
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        version:
          type: integer
        revoked_sessions:
          type: integer
          description: 一并撤销掉的登录会话数。暂停但不踢下线等于没暂停。
        suspended_at:
          type: string
          format: date-time
          nullable: true
        suspension_expires_at:
          type: string
          format: date-time
          nullable: true
        audit_log_id:
          type: string
    SuspendResultResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SuspendResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RevokeSessionsResult:
      type: object
      additionalProperties: false
      required:
        - user_id
        - revoked_sessions
        - effective_at
        - audit_log_id
      properties:
        user_id:
          type: string
        revoked_sessions:
          type: integer
        effective_at:
          type: string
          format: date-time
        audit_log_id:
          type: string
    RevokeSessionsResultResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/RevokeSessionsResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SetBudgetRequest:
      type: object
      additionalProperties: false
      description: |
        设置用户的 AI 预算。

        预算按**调用次数**而不是金额：金额要靠用量乘单价算，而单价会变；
        次数封顶，用户和运营都算得清。

        **不会因为设了预算就替用户打开 AI。** 用户自己关掉的开关，
        管理员不代他打开——那是他的选择。
      required:
        - expected_version
        - reason_code
        - reason_text
      properties:
        expected_version:
          type: integer
          minimum: 0
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
        reason_text:
          type: string
          minLength: 4
          maxLength: 500
        daily_calls:
          type: integer
          nullable: true
          minimum: 0
        monthly_calls:
          type: integer
          nullable: true
          minimum: 0
        effective_from:
          type: string
          format: date-time
          nullable: true
        effective_until:
          type: string
          format: date-time
          nullable: true
    BudgetResult:
      type: object
      additionalProperties: false
      required:
        - user_id
        - audit_log_id
      properties:
        user_id:
          type: string
        budget:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AIBudget'
        audit_log_id:
          type: string
    BudgetResultResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/BudgetResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UsageUnit:
      type: string
      enum:
        - input_token
        - cached_input_token
        - output_token
        - audio_second
        - image
        - request
    AIPrice:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - model
        - usage_unit
        - unit_size
        - unit_price_usd
        - effective_from
      properties:
        id:
          type: string
        provider:
          type: string
        model:
          type: string
        usage_unit:
          $ref: '#/components/schemas/UsageUnit'
        unit_size:
          type: string
          description: 单价对应的用量。**用字符串传 decimal**，JSON number 会漂。
        unit_price_usd:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
    AIPriceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AIPrice'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CreateAIPriceRequest:
      type: object
      additionalProperties: false
      description: |
        新增一个价格版本。**不覆盖旧值**——覆盖会让上个月的报表这个月一看
        变了数，那份报表就没有任何意义了。
      required:
        - provider
        - model
        - usage_unit
        - unit_size
        - unit_price_usd
        - effective_from
      properties:
        provider:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        usage_unit:
          $ref: '#/components/schemas/UsageUnit'
        unit_size:
          type: string
        unit_price_usd:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
    AIPriceResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AIPrice'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    BadRequest:
      description: 参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        未登录或会话已失效。

        Cache-Control 由中间件统一设置（private, no-store），
        不在每个响应上重复声明——重复声明只会让生成的类型多一层包装。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF 或 Origin 校验未通过。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过于频繁。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 目标不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 版本冲突、状态冲突或幂等键复用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    CSRFToken:
      name: X-Admin-CSRF
      in: header
      required: true
      description: 登录时下发，写操作必带。与 Origin 校验一起用，单靠任何一个都不够。
      schema:
        type: string
    RangeFrom:
      name: from
      in: query
      required: false
      description: 统计区间起始日（含），按后台报表时区切日。
      schema:
        type: string
        format: date
    RangeTo:
      name: to
      in: query
      required: false
      description: 统计区间结束日（含）。
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 next_cursor，不透明。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 20，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserStatusFilter:
      name: account_status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AccountStatus'
    InitializedFilter:
      name: initialized
      in: query
      required: false
      schema:
        type: boolean
    UserIDFilter:
      name: user_id
      in: query
      required: false
      description: 精确匹配用户 ID。
      schema:
        type: string
    PhoneFilter:
      name: phone
      in: query
      required: false
      description: |
        **精确**匹配手机号。服务端用版本化 HMAC 比对，库里没有明文。

        只支持精确匹配，不支持前缀或模糊——模糊搜索等于提供了一个
        把号码一位一位试出来的接口。
      schema:
        type: string
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    FunnelName:
      name: funnel
      in: path
      required: true
      schema:
        type: string
        enum:
          - onboarding
          - capture
          - assistant
    GroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - date
          - feature
          - provider
          - model
        default: date
    OperationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
    ActionFilter:
      name: action
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        写操作必带。同一个键配同样的请求体返回同样的结果；
        配不同的请求体返回冲突——那说明调用方把键复用错了。
      schema:
        type: string
        minLength: 8
        maxLength: 128
