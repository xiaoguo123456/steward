    MoneyAmount:
      type: object
      additionalProperties: false
      description: |
        金额。**用字符串传 decimal**，不用 number——
        JSON 的 number 是 IEEE754 双精度，累加会漂。

        status=pricing_missing 时 amount 为 null，界面显示「价格缺失」**而不是 0**：
        「不知道多少钱」和「不花钱」是完全不同的两件事，
        显示成 0 会让人以为这条链路免费。
      required:
        - amount
        - currency
        - status
      properties:
        amount:
          type: string
          nullable: true
          example: '2.381245'
        currency:
          type: string
          enum:
            - USD
        status:
          $ref: '#/components/schemas/CostStatus'
    AIMetrics:
      type: object
