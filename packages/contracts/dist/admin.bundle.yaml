          type: integer
        success_rate:
          type: number
          format: double
          nullable: true
          description: 分母为 0 时为空，界面显示“—”而不是 0%。
        p95_latency_ms:
          type: integer
          nullable: true
        cost:
          $ref: '#/components/schemas/MoneyAmount'
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        pricing_missing_calls:
          type: integer
          description: 有用量但匹配不到价格的调用数。它不为 0 时，成本一定是偏低的。
