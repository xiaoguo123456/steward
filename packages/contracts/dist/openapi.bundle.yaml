openapi: 3.0.3
info:
  title: AI事管家 API
  version: 1.0.0
  description: |
    AI事管家的唯一网络契约来源。前后端不得在任一侧手写 DTO、URL、枚举或错误码。

    约定：
    - 所有成功响应统一为 `{data, meta}`，集合额外带 `page`。
    - 所有错误响应统一为 `{error, meta}`，App 只依赖 `error.code` 分支。
    - 写请求必须携带 `Idempotency-Key`；并发编辑应携带 `If-Match`。
    - 异步处理返回 `202` 与 `operation_id`，客户端通过 Operation 轮询。
    - 私有内容默认 `Cache-Control: private, no-store`。
servers:
  - url: http://localhost:8787
    description: 本地开发
  - url: https://api.example.com
    description: 生产占位；正式域名待运维确认
security:
  - bearerAuth: []
tags:
  - name: auth
    x-displayName: 账户与登录
  - name: users
    x-displayName: 用户资料与偏好
  - name: lists
    x-displayName: 清单
  - name: tasks
    x-displayName: 任务
  - name: events
    x-displayName: 日程与重要日
  - name: projects
    x-displayName: 项目
  - name: notes
    x-displayName: 笔记
  - name: trackers
    x-displayName: 记录与数据
  - name: captures
    x-displayName: 统一输入
  - name: media
    x-displayName: 媒体上传
  - name: assistant
    x-displayName: AI 助手
  - name: memory
    x-displayName: 长期记忆
  - name: recipes
    x-displayName: 菜谱内容
  - name: views
    x-displayName: 聚合视图
  - name: system
    x-displayName: 系统
paths:
  /v1/auth/phone-code:
    post:
      operationId: requestPhoneCode
      summary: 发送登录验证码
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
      responses:
        '200':
          description: 验证码已发送。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/login:
    post:
      operationId: login
      summary: 手机号验证码登录
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功。首次登录同时完成用户初始化并创建默认清单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: 用 Refresh Token 换取新的 Access Token
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前 Refresh Token
      tags:
        - auth
      responses:
        '200':
          description: 已注销。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: 读取当前用户资料
      tags:
        - users
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateCurrentUser
      summary: 修改当前用户资料
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/preferences:
    get:
      operationId: getUserPreferences
      summary: 读取显式偏好设置
      tags:
        - users
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateUserPreferences
      summary: 修改显式偏好设置
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/ai-settings:
    get:
      operationId: getAiSettings
      summary: 读取 AI 开关
      tags:
        - users
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAiSettings
      summary: 修改 AI 开关
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsRequest'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/task-lists:
    get:
      operationId: listTaskLists
      summary: 读取当前用户的全部清单
      tags:
        - lists
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 按 position 升序返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTaskList
      summary: 新建清单
      tags:
        - lists
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskListRequest'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/task-lists/{list_id}:
    patch:
      operationId: updateTaskList
      summary: 修改清单
      tags:
        - lists
      parameters:
        - $ref: '#/components/parameters/TaskListId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskListRequest'
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTaskList
      summary: 删除清单
      description: |
        清单非空时必须提供 move_tasks_to_list_id，否则返回 TASK_LIST_NOT_EMPTY。
        默认清单在没有替代默认清单时不可删除。
      tags:
        - lists
      parameters:
        - $ref: '#/components/parameters/TaskListId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTaskListRequest'
      responses:
        '200':
          description: 删除成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: 按条件查询 Task
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: 不传时默认返回 todo 与 doing。
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
          style: form
          explode: false
        - name: list_id
          in: query
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: due_before
          in: query
          required: false
          description: 以用户时区解释的当地日期上界，含当日。
          schema:
            type: string
            format: date
        - name: scheduled_on
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: day
          in: query
          required: false
          description: |
            该当地日期需要关注的 Task，收录规则与 Today 完全一致：
            当日截止、当日有计划时间、已逾期，或被明确加入当天。
            用于“明天”等按天视图，避免客户端自行推导收录条件。
          schema:
            type: string
            format: date
        - name: unscheduled
          in: query
          required: false
          description: 为 true 时只返回 todo 且没有任何截止、计划与 focus_date 的 Task。
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: 标题关键词。
          schema:
            type: string
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTask
      summary: 新建 Task
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: 读取 Task 详情
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTask
      summary: 修改 Task
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTask
      summary: 删除 Task
      description: 软删除。删除不属于状态转换。
      tags:
        - tasks
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 删除成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/events:
    get:
      operationId: listEvents
      summary: 按时间范围查询 Event
      tags:
        - events
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: from
          in: query
          required: false
          description: 当地日期下界，含当日。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: event_kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventKind'
        - name: project_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功。yearly 重复的重要日已按查询范围投影为具体日期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createEvent
      summary: 新建 Event
      tags:
        - events
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/events/{event_id}:
    get:
      operationId: getEvent
      summary: 读取 Event 详情
      tags:
        - events
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateEvent
      summary: 修改 Event
      tags:
        - events
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: 修改成功。相对提醒跟随新的开始时间重新计算。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteEvent
      summary: 删除 Event
      tags:
        - events
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 删除成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects:
    get:
      operationId: listProjects
      summary: 查询 Project
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: 不传时默认排除 archived。
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProjectStatus'
          style: form
          explode: false
        - name: project_kind
          in: query
          required: false
          description: 只返回该用途的项目。行程页据此拿到自己的列表。
          schema:
            $ref: '#/components/schemas/ProjectKind'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: 新建 Project
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects/{project_id}:
    get:
      operationId: getProject
      summary: 读取 Project 详情
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: 修改 Project
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteProject
      summary: 删除 Project
      tags:
        - projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 删除成功。关联对象的 project_id 被清空，对象本身保留。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/notes:
    get:
      operationId: listNotes
      summary: 查询 Note
      tags:
        - notes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
