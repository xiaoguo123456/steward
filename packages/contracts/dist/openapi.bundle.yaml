          type: array
          items:
            $ref: '#/components/schemas/AssistantThread'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CreateThreadRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        force_new:
          type: boolean
          default: false
          description: |
            为 true 时一定新建。缺省时若最近一次对话仍在续用窗口内，
            直接返回那一次，而不是每次打开面板都堆一个新对话。
          nullable: true
          maxLength: 60
    AssistantThreadResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AssistantThread'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UpdateThreadRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        status:
          $ref: '#/components/schemas/ThreadStatus'
    MessageRole:
      type: string
      enum:
        - user
        - assistant
        - system_summary
    AssistantMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - message_seq
        - role
        - content
        - status
        - created_at
      properties:
        id:
          type: string
          example: amsg_01J8Z3
        thread_id:
          type: string
        message_seq:
          type: integer
          description: Thread 内单调递增序号。消息一经展示不原地改写。
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          description: |
            用户可见文本。不包含 Provider 原始响应对象，
            也不包含模型的隐藏思维过程。
        status:
          type: string
          enum:
            - draft
            - completed
            - failed
            - superseded
        turn_id:
          type: string
          nullable: true
        proposal_ids:
          type: array
          description: 本条消息附带的待确认建议。
          items:
            type: string
        created_at:
          type: string
          format: date-time
    AssistantMessagesResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - meta
      properties:
        data:
          type: array
          description: 按 message_seq 倒序返回，最新的在前。
          items:
            $ref: '#/components/schemas/AssistantMessage'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EntryContext:
      type: object
      additionalProperties: false
      description: |
        客户端的页面上下文，只用于消歧，不是授权。
        服务端会重新校验资源归属与版本；App 不得传入权限结论。
      properties:
        screen:
          type: string
          description: 例如 task_detail、today。
        resource_type:
          type: string
          nullable: true
        resource_id:
          type: string
          nullable: true
        selected_date:
          type: string
          format: date
          nullable: true
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            第一阶段通用 Assistant 只支持文本。
            图片与音频继续走统一 Capture，不在这里重复一套媒体协议。
        entry_context:
          $ref: '#/components/schemas/EntryContext'
    TurnAcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - thread_id
            - message_id
            - turn_id
            - operation_id
          properties:
            thread_id:
              type: string
            message_id:
              type: string
            turn_id:
              type: string
            operation_id:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TurnStreamEventKind:
      type: string
      description: |
        status 是阶段变化，tool 是正在调用的能力标签，delta 是回复文本增量，
        proposal 表示一条已经落库的建议，done 表示这一轮结束，error 表示失败。
      enum:
        - status
        - tool
        - delta
        - proposal
        - done
        - error
    TurnStreamEvent:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/TurnStreamEventKind'
        text:
          type: string
          description: |
            kind=delta 时是「到目前为止的完整回复文本」，不是增量：
            客户端直接替换缓冲区。这样丢事件不会造成文字缺失，
            中途连上来的客户端也不需要额外的补齐与去重规则。
            kind=status／tool 时是人类可读的短标签。
            任何情况下都不包含工具参数、工具结果或模型的内部思维过程。
        proposal_id:
          type: string
          description: 只在 kind=proposal 出现。建议此时已经通过完整校验并落库。
        truncated:
          type: boolean
          default: false
          description: |
            这条快照被传输层截断过，屏幕上的文字还不是全部。
            done 之后读消息列表即可拿到完整内容。
        code:
          $ref: '#/components/schemas/ErrorCode'
    ProposalStatus:
      type: string
      enum:
        - pending
        - executed
        - rejected
        - expired
        - stale
        - superseded
        - failed
    ProposalType:
      type: string
      description: |
        每种类型都有独立的 command 结构与对应的 Domain Command Mapper。
        command 不是任意 JSON Patch。
      enum:
        - task_create
        - task_update
        - event_create
        - memory_upsert
    ProposalChange:
      type: object
      additionalProperties: false
      required:
        - field
        - label
      properties:
        field:
          type: string
        label:
          type: string
          description: 面向用户的字段名。
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
    ProposalPreview:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          description: 一句话说明这条建议会做什么。
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ProposalChange'
        impact:
          type: string
          nullable: true
          description: 影响范围说明，例如会影响多少条内容。
    ActionProposal:
      type: object
      additionalProperties: false
