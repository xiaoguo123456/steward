          $ref: '#/components/schemas/ResponseMeta'
    MemoryType:
      type: string
      description: |
        第一阶段只开放这几种稳定类型。
        禁止用一个自由文本类型无限承载未知业务。
      enum:
        - communication_preference
        - routine_preference
        - domain_preference
        - personal_context
        - constraint
    MemoryStatus:
      type: string
      enum:
        - active
        - superseded
        - deleted
        - expired
        - shadowed
    MemorySensitivity:
      type: string
      description: |
        健康、财务、住址、家庭关系与受保护属性默认视为高敏。
        高敏记忆只允许用户明确输入并单独确认，不通过行为自动推断。
      enum:
        - normal
        - sensitive
        - highly_sensitive
    MemoryOrigin:
      type: string
      description: explicit 表示用户直接说出；learned 表示从对话中学到并经确认。
      enum:
        - explicit
        - learned
        - imported
    MemoryEvidence:
      type: object
      additionalProperties: false
      required:
        - source_type
        - source_id
        - evidence_role
        - created_at
      properties:
        source_type:
          type: string
          enum:
            - assistant_message
            - user_message
            - object
            - record
            - user_setting
        source_id:
          type: string
        source_deleted:
          type: boolean
          default: false
          description: 来源被删除后显示 tombstone，不把原文复制回记忆。
        evidence_role:
          type: string
          enum:
            - explicit
            - inferred
