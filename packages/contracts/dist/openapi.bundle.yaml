          type: string
        text_start:
          type: integer
          nullable: true
        text_end:
          type: integer
          nullable: true
        audio_start_ms:
          type: integer
          nullable: true
        audio_end_ms:
          type: integer
          nullable: true
        image_region:
          type: string
          nullable: true
          description: 归一化区域，格式 "x,y,w,h"，取值 0 到 1。
    CaptureFieldConfidence:
      type: object
      additionalProperties: false
      required:
        - field
        - level
      properties:
        field:
          type: string
        level:
          type: string
          description: |
            high 表示用户明确表达；medium 表示可从输入合理推断；low 表示需要用户确认。
            置信度只用于排序与是否追问，不能用于跳过用户确认。
          enum:
            - high
            - medium
            - low
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/CaptureSourceRef'
    CaptureCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_type
        - action
        - selected
        - payload
      properties:
        id:
          type: string
          example: cnd_01J8Z3
        candidate_type:
          $ref: '#/components/schemas/CaptureCandidateType'
        action:
          $ref: '#/components/schemas/CaptureCandidateAction'
        target_id:
          type: string
          nullable: true
          description: action=update 时指向已有实体。
        target_expected_version:
          type: integer
          nullable: true
        selected:
          type: boolean
          description: 服务端给出的默认勾选状态，用户可以修改。
        payload:
          $ref: '#/components/schemas/CaptureDraftPayload'
        field_confidences:
          type: array
          items:
            $ref: '#/components/schemas/CaptureFieldConfidence'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/CaptureSourceRef'
        missing_fields:
          type: array
          description: 未解决的必填字段。非空时不允许保存该候选项。
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        duplicate_of:
          type: string
          nullable: true
          description: 服务端确定性重复检测命中的已有实体 ID。
    RelationKind:
      type: string
      enum:
        - requires
        - related_to
    CaptureRelationCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - from_ref
        - to_ref
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/RelationKind'
        from_ref:
          type: string
          description: 已有实体 ID 或本次候选的 candidate_id。
        to_ref:
          type: string
    CaptureQuestion:
      type: object
      additionalProperties: false
      required:
        - id
        - capture_id
        - question
        - blocking
        - status
        - created_at
      properties:
        id:
          type: string
          example: cq_01J8Z3
        capture_id:
          type: string
        question:
          type: string
          description: 面向用户的中文追问，说明为什么需要这项信息。
        blocking:
          type: boolean
          description: 为 true 时 Capture 处于 awaiting_instruction，解析被阻塞。
        status:
          type: string
          enum:
            - open
            - answered
            - superseded
            - expired
        quick_answers:
          type: array
          description: 可直接点击的快捷回答，仍需生成新 revision 重新解析。
          items:
            type: string
        capture_summary:
          type: string
          description: 用于全局待答入口列表展示的一句话摘要。
        created_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
          nullable: true
    CaptureConflict:
      type: object
      additionalProperties: false
      required:
        - id
        - field
        - options
      properties:
        id:
          type: string
        field:
          type: string
          description: 发生冲突的语义字段，例如 date、amount、title。
        description:
          type: string
        options:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required:
              - value
              - source_refs
            properties:
              value:
                type: string
              source_refs:
                type: array
                items:
                  $ref: '#/components/schemas/CaptureSourceRef'
    Capture:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - revision
        - origin
        - parts
        - candidates
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: cap_01J8Z3
        status:
          $ref: '#/components/schemas/CaptureStatus'
        revision:
          type: integer
          description: 当前最新 revision。只允许确认最新 revision。
        origin:
          $ref: '#/components/schemas/CaptureOrigin'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/CapturePart'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CaptureCandidate'
        relation_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CaptureRelationCandidate'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CaptureQuestion'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CaptureConflict'
        instruction_note:
          type: string
          nullable: true
          description: 用户在文字或语音中给出的限制条件，例如“只处理第一张”。
        error:
          $ref: '#/components/schemas/ErrorBody'
        created_objects:
          type: array
          description: 确认后本次实际创建或更新的实体引用。
          items:
            $ref: '#/components/schemas/AffectedResource'
        activity_batch_id:
          type: string
          nullable: true
          description: 确认成功后生成的 Activity 批次，用于即时撤销。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
    CaptureResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Capture'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConfirmCaptureItem:
      type: object
      additionalProperties: false
      description: |
        用户勾选保存的一个候选项。payload 为用户编辑后的值，
        缺省表示采用服务端候选的原值；服务端始终重新校验，不信任客户端提交的结果。
