          type: string
          description: 字段稳定标识，同一 Tracker 内唯一，仅允许小写字母、数字和下划线。
          pattern: ^[a-z][a-z0-9_]{0,39}$
        label:
          type: string
          description: 用户可见字段名。
        type:
          $ref: '#/components/schemas/TrackerFieldType'
        required:
          type: boolean
        unit:
          type: string
          nullable: true
          description: |
            可选单位，例如 kg、元、分钟。
            单位换算由服务端确定性代码执行，客户端不得自行折算后写入。
