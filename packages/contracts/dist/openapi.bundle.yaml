        event:
          $ref: '#/components/schemas/CaptureEventDraft'
        project:
          $ref: '#/components/schemas/CaptureProjectDraft'
        note:
          $ref: '#/components/schemas/CaptureNoteDraft'
        tracker:
          $ref: '#/components/schemas/CaptureTrackerDraft'
        record:
          $ref: '#/components/schemas/CaptureRecordDraft'
    CaptureSourceRef:
      type: object
