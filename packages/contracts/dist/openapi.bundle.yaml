  /v1/assistant/proposals/{proposal_id}/confirm:
    post:
      operationId: confirmProposal
      summary: 确认并执行建议
      description: |
        服务端会重新读取目标、重新执行权限与状态机校验，再把允许的用户编辑
        映射成类型化 Domain Command 执行。模型给出的理由不能替代这一步。
        目标在建议生成后被改动过时返回 AI_PROPOSAL_STALE。
      tags:
        - assistant
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
