        - status
        - preview
        - reason
        - expires_at
        - created_at
        - version
      properties:
        id:
          type: string
          example: aprp_01J8Z3
        thread_id:
          type: string
          nullable: true
        turn_id:
          type: string
          nullable: true
        proposal_type:
          $ref: '#/components/schemas/ProposalType'
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        target_expected_version:
          type: integer
          nullable: true
          description: 目标在建议生成后被改动过时，确认会失败并标记 stale。
        status:
          $ref: '#/components/schemas/ProposalStatus'
        preview:
          $ref: '#/components/schemas/ProposalPreview'
        reason:
          type: string
          description: 模型给出的理由。它不能替代服务端的重新校验。
        source_refs:
          type: array
          description: 生成这条建议时实际读取过的来源。
          items:
            type: string
        editable_fields:
          type: array
          description: 用户在确认页可以修改的字段。其他字段不接受编辑。
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        executed_batch_id:
          type: string
          nullable: true
          description: 执行成功后生成的 Activity 批次，用于撤销。
        created_at:
          type: string
          format: date-time
        version:
          type: integer
    ActionProposalsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActionProposal'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ActionProposalResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ActionProposal'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConfirmProposalRequest:
      type: object
      additionalProperties: false
      required:
        - proposal_version
      properties:
        proposal_version:
          type: integer
          description: 与服务端当前版本不一致时拒绝执行。
        target_expected_version:
          type: integer
          nullable: true
          description: 目标资源的期望版本，缺省时使用建议生成时记录的版本。
        edits:
          type: object
          additionalProperties: true
          description: |
            用户在确认页的修改，只允许 editable_fields 声明过的字段。
            不接受替换 command 类型或目标 ID。
    ConfirmProposalResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - proposal
            - affected_resources
