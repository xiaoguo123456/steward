    RecipeCategory:
      type: string
      enum:
        - recommended
        - quick
        - seasonal
        - fat_loss
        - muscle_gain
        - steady_sugar
    RecipeMealSlot:
      type: string
      enum:
        - breakfast
        - lunch
        - dinner
    RecipeDifficulty:
      type: string
      enum:
        - easy
        - medium
        - hard
    RecipeNutrition:
      type: object
      additionalProperties: false
      required:
        - calories
        - protein_g
        - carbs_g
      description: |
        每份的营养估算。它是估算值，不是营养档案，也不构成任何健康承诺。

        **fat_g 与 fiber_g 可能为空，空表示「不知道」而不是 0。**
        不同来源的菜谱给出的营养项不一样：手写内容有膳食纤维没有脂肪，
        导入内容反过来。把没有的那项填成 0 是个假声明——
        「这道菜 0g 膳食纤维」和「不知道多少」是完全不同的两句话，
        而控糖目标恰恰要看膳食纤维。客户端对空值显示「—」，不显示 0。
      properties:
        calories:
          type: number
          format: double
        protein_g:
          type: number
          format: double
        carbs_g:
          type: number
          format: double
        fat_g:
          type: number
          format: double
          nullable: true
        fiber_g:
          type: number
          format: double
          nullable: true
    RecipeGoal:
      type: string
      description: |
        steady_sugar 只用于推荐少添加糖、优先全谷物、增加膳食纤维的日常菜谱，
        不提供疾病诊断、治疗承诺或用药建议。
      enum:
        - balanced
        - fat_loss
        - muscle_gain
        - steady_sugar
    RecipeComponent:
      type: string
      description: |
        这道菜在一餐里扮演什么角色。周菜单按类别组合，不按固定道数。

        - staple：纯主食，要配菜（白粥、馒头）
        - one_dish：单品成餐，本身就把主食和蛋白都包了（牛肉面、蛋包饭），
          配一道素菜就够，不再另配主食与荤菜
        - protein：荤菜。豆制品也算——在中餐里它承担的正是这个位置
        - vegetable：素菜
      enum:
        - staple
        - one_dish
        - protein
        - vegetable
    RecipeIngredientGroup:
      type: string
      description: 与购物清单的品类分开：这里是做菜时的分组，不是超市货架。
      enum:
        - produce
        - protein
        - staple
        - seasoning
    RecipeIngredient:
      type: object
      additionalProperties: false
      required:
        - name
        - amount
        - group
      properties:
        name:
          type: string
        amount:
          type: string
          description: 自由文本，例如「300 克」「适量」。生成购物清单时按名称合并。
        group:
          $ref: '#/components/schemas/RecipeIngredientGroup'
    RecipeStep:
      type: object
      additionalProperties: false
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        timer_minutes:
          type: integer
          nullable: true
          description: 这一步需要计时时给出分钟数，烹饪模式据此提供倒计时。
    RecipeSource:
      type: object
      additionalProperties: false
      required:
        - name
        - license
        - content_version
      description: |
        内容来源与授权。字段不全的菜谱不允许进库：
        不知道来源和授权范围，就等于不知道自己有没有权利展示它。
      properties:
        name:
          type: string
          description: 内容提供方。
        author:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: 原始出处。
        license:
          type: string
          description: 授权范围，例如 CC-BY-4.0、平台自有内容。
        license_url:
          type: string
          nullable: true
        image_credit:
          type: string
          nullable: true
          description: 图片的权利说明。没有明确权利的图片不下发 image_url。
        content_version:
          type: string
          description: 内容版本。来源更新时递增，客户端据此判断缓存是否过期。
    Recipe:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - servings
        - duration_minutes
        - difficulty
        - nutrition
        - meal_slots
        - categories
        - goals
        - tags
        - allergens
        - ingredients
        - steps
        - source
      properties:
        id:
          type: string
          example: rcp_01J8Z3
        title:
          type: string
        summary:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: |
            没有明确图片权利时为 null，客户端展示占位而不是随便找一张图。

            它是当前分发方式下的地址。稳定标识是 image_key——
            换域名或改成签名分发时，URL 会变而键不变。
        servings:
          type: integer
          minimum: 1
        duration_minutes:
          type: integer
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/RecipeDifficulty'
        nutrition:
          $ref: '#/components/schemas/RecipeNutrition'
        meal_slots:
          type: array
          items:
            $ref: '#/components/schemas/RecipeMealSlot'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/RecipeCategory'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/RecipeGoal'
        tags:
          type: array
          items:
            type: string
        component:
          description: |
            这道菜在一餐里扮演什么角色，周菜单据此组合。
            为空表示还没分类，此时不会进入周菜单生成。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RecipeComponent'
        allergens:
          type: array
          description: |
            过敏原是确定性硬过滤条件，任何排序或推荐都不得覆盖它。
          items:
            type: string
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeStep'
        source:
          $ref: '#/components/schemas/RecipeSource'
    RecipesResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RecipeResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Recipe'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PendingReminder:
      type: object
      additionalProperties: false
      description: |
        一条到点了、用户还没处理的提醒。

        它不是一张表里的行：提醒是事项上的一条规则，加上一次「发生」算出来的时刻。
        因此 id 是复合键（来源 ID｜规则 ID｜这次发生的日期），消掉时原样回传。
      required:
        - id
        - source_type
        - source_id
        - title
        - fire_at
        - occurrence_date
      properties:
        id:
          type: string
          description: 复合键，消掉这条提醒时原样回传。
          example: evt_01J8Z3|rmd_01J8Z4|2026-08-22
        source_type:
          type: string
          enum:
            - task
            - event
        source_id:
          type: string
          description: 点击后跳转到这个事项。
        title:
          type: string
        fire_at:
          type: string
          format: date-time
          description: 这条提醒该响的时刻。可能已经过去，客户端据此显示「今天」或具体日期。
        occurrence_date:
          type: string
          format: date
          description: 这一次发生的日期。重要日每年重复，靠它区分是哪一年那次。
        event_kind:
          $ref: '#/components/schemas/EventKind'
    PendingRemindersResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingReminder'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DismissReminderRequest:
      type: object
      additionalProperties: false
      description: 消掉一条提醒。重复提交同一条不报错——网络重试很常见。
      required:
        - id
      properties:
        id:
          type: string
          description: PendingReminder 的 id，原样回传。
    ChangePhoneRequest:
      type: object
      additionalProperties: false
      description: |
        更换绑定手机号。

        **要同时验证旧号与新号**：这个产品的账号就是手机号（登录＝手机号＋验证码），
        换绑是权限最高的操作。只验新号的话，一个被劫持的会话就能永久接管账号，
        而真正的机主再也登不进来——他的号码已经不再对应任何账号。
        要求旧号的验证码意味着「光有会话不够」。

        两个验证码都要用 purpose=change_phone 获取。
        成功后其他设备上的登录会被登出，当前设备不受影响。
      required:
        - current_code
        - new_phone
        - new_code
      properties:
        current_code:
          type: string
          description: 发到当前绑定手机号的验证码。
          pattern: ^[0-9]{6}$
        new_phone:
          type: string
          pattern: ^1[3-9][0-9]{9}$
        new_code:
          type: string
          description: 发到新手机号的验证码。
          pattern: ^[0-9]{6}$
    DietGoal:
      type: string
      description: |
        与 RecipeGoal 取值一致：用户的目标要能直接拿去筛菜谱。
        steady_sugar 只用于推荐少糖、全谷物、高纤维的日常菜谱，
        不提供疾病诊断、治疗承诺或用药建议。
      enum:
        - balanced
        - fat_loss
        - muscle_gain
        - steady_sugar
    DietSex:
      type: string
      description: 仅用于能量估算。用户可以不填。
      enum:
        - female
        - male
        - unspecified
    DietActivityLevel:
      type: string
      enum:
        - sedentary
        - light
        - moderate
        - active
    DietBudget:
      type: string
      enum:
        - economy
        - standard
        - flexible
    DietProfile:
      type: object
      additionalProperties: false
      description: |
        饮食档案。**身体数据属于高敏信息**：只允许用户自己填写与修改，
        不接受任何推断，也不得写入日志、埋点、Prompt 快照或测试 Fixture。

        allergens 与 dislikes 是确定性硬过滤条件，排序与推荐都不得覆盖它们。
      required:
        - goal
        - allergens
        - dislikes
        - servings
        - updated_at
      properties:
        goal:
          $ref: '#/components/schemas/DietGoal'
        age:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
        sex:
          $ref: '#/components/schemas/DietSex'
        height_cm:
          type: number
          format: double
          nullable: true
          minimum: 50
          maximum: 260
        weight_kg:
          type: number
          format: double
          nullable: true
          minimum: 20
          maximum: 400
        target_weight_kg:
          type: number
          format: double
          nullable: true
          minimum: 20
          maximum: 400
        activity_level:
          $ref: '#/components/schemas/DietActivityLevel'
        allergens:
          type: array
          description: 过敏原。命中即从推荐中剔除，不做降权处理。
          items:
            type: string
        dislikes:
          type: array
          description: 忌口。与过敏原同样是硬过滤，只是后果不同。
          items:
            type: string
        servings:
          type: integer
          description: 常规用餐人数，用于换算食材份量。
          minimum: 1
          maximum: 20
        max_cook_minutes:
          type: integer
          nullable: true
          minimum: 1
        budget:
          $ref: '#/components/schemas/DietBudget'
        tastes:
          type: array
          description: 口味偏好，例如「清淡」「辣」。用于排序，不是硬过滤。
          items:
            type: string
        equipment:
          type: array
          description: 家里有的厨具。缺少某道菜需要的厨具时降低它的优先级。
          items:
            type: string
        diagnosed_condition:
          type: boolean
          description: |
            用户自述已确诊相关疾病或正在用药。**只接受用户明确勾选**，不接受任何推断。
            为 true 时不生成治疗型菜单，并提示结合医生或营养师建议——
            这个产品不提供诊断、治疗承诺或用药建议。
        completed:
          type: boolean
          description: 是否完成过问卷。false 时客户端引导填写，但不阻止浏览菜谱。
        updated_at:
          type: string
          format: date-time
    DietProfileResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/DietProfile'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UpdateDietProfileRequest:
      type: object
      additionalProperties: false
      description: |
        只提交需要修改的字段；不传表示保持原值。
        清空一个可空字段必须把字段名放进 clear 数组，
        因为生成的 Go 类型无法区分“不传”与“传 null”。
      properties:
        clear:
          type: array
          items:
            type: string
            enum:
              - age
              - height_cm
              - weight_kg
              - target_weight_kg
              - max_cook_minutes
        goal:
          $ref: '#/components/schemas/DietGoal'
        age:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
        sex:
          $ref: '#/components/schemas/DietSex'
        height_cm:
          type: number
          format: double
          nullable: true
          minimum: 50
          maximum: 260
        weight_kg:
          type: number
          format: double
          nullable: true
          minimum: 20
          maximum: 400
        target_weight_kg:
          type: number
          format: double
          nullable: true
          minimum: 20
          maximum: 400
        activity_level:
          $ref: '#/components/schemas/DietActivityLevel'
        allergens:
          type: array
          items:
            type: string
        dislikes:
          type: array
          items:
            type: string
        servings:
          type: integer
          minimum: 1
          maximum: 20
        max_cook_minutes:
          type: integer
          nullable: true
          minimum: 1
        budget:
          $ref: '#/components/schemas/DietBudget'
        tastes:
          type: array
          items:
            type: string
        equipment:
          type: array
          items:
            type: string
        diagnosed_condition:
          type: boolean
          description: 只接受用户明确勾选，不接受任何推断。
        completed:
          type: boolean
    MealPlanEntry:
      type: object
      additionalProperties: false
      description: |
        菜单里的一道菜。**一格可以有多道**：早餐是主食+蛋白，午晚是主食+荤+素。

        一格一道的话，单道菜的热量中位数只有 318 kcal，
        按身高体重算出来的每餐目标根本够不到。
      required:
        - date
        - meal_slot
        - recipe_id
      properties:
        date:
          type: string
          format: date
          description: 该餐所在日期。用真实日期而不是“周几”，跨周与跨时区才不会含糊。
        meal_slot:
          $ref: '#/components/schemas/RecipeMealSlot'
        recipe_id:
          type: string
        component:
          description: |
            这道菜在这一格里扮演什么角色，展示顺序也按它排（主食在前）。

            随菜单存下来而不是每次去菜谱里查：菜谱的分类将来可能因规则调整而变，
            但用户确认过的那份菜单里“这道是主食”是当时的事实。
          allOf:
            - $ref: '#/components/schemas/RecipeComponent'
        recipe:
          description: 展开的菜谱，列表页据此显示菜名与营养，不用逐条再查。
          allOf:
            - $ref: '#/components/schemas/Recipe'
    MealPlan:
      type: object
      additionalProperties: false
      description: |
        已确认的本周菜单。

        AI 生成的预览不在这里：规格 8.2.2 要求预览只是预览，
        用户点过“采用本周菜单”才算数，所以草稿留在客户端，不落库。
      required:
        - id
        - week_start
        - entries
        - planned_nutrition
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          example: mpl_01J8Z3
        week_start:
          type: string
          format: date
          description: |
            本周第一天。由服务端按用户的 week_start 偏好计算，
            客户端不自行推导——周一还是周日开始是用户设置。
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealPlanEntry'
        planned_nutrition:
          description: |
            **这份菜单本身的能量**，由服务端按菜谱营养求和。

            它说的是「照这个方案做出来有多少」，不是用户吃了多少——
            用户加不加餐、在外面吃什么，我们不追踪，也不该拿这个数去暗示。
          allOf:
            - $ref: '#/components/schemas/RecipeNutrition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    MealPlanResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/MealPlan'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MealPlanEntryInput:
      type: object
      additionalProperties: false
      required:
        - date
        - meal_slot
        - recipe_id
      properties:
        date:
          type: string
          format: date
        meal_slot:
          $ref: '#/components/schemas/RecipeMealSlot'
        recipe_id:
          type: string
        component:
          description: |
            这道菜在这一格里的角色。不传时服务端按菜谱当前的分类填。

            提交时带上，是为了让用户确认的那一版原样存下来：
            菜谱分类将来可能因规则调整而变，已确认的菜单不该跟着变。
          allOf:
            - $ref: '#/components/schemas/RecipeComponent'
    ConfirmMealPlanRequest:
      type: object
      additionalProperties: false
      description: |
        采用一份菜单。整周一次性提交：菜单是一个整体，
        逐格增量提交会让“这周到底是哪一版”说不清楚。
      required:
        - week_start
        - entries
      properties:
        week_start:
          type: string
          format: date
        entries:
          type: array
          description: 空数组表示清空本周菜单。
          items:
            $ref: '#/components/schemas/MealPlanEntryInput'
    MealPlanCandidateCounts:
      type: object
      additionalProperties: false
      required:
        - breakfast
        - lunch
        - dinner
      properties:
        breakfast:
          type: integer
        lunch:
          type: integer
        dinner:
          type: integer
    DailyNutritionTarget:
      type: object
      additionalProperties: false
      description: |
        每日营养目标。热量用 Mifflin-St Jeor 估算基础代谢，乘活动系数，
        再按目标调整（减脂 −20%、增肌 +10%）。

        **有硬下限**（女 1200、男 1500 千卡）：低于它就不是吃得少而是吃不够，
        夹住并在 notes 里说明。

        这是一般性的能量估算，不是治疗方案。
      required:
        - calories
        - protein_g
        - carbs_g
        - fat_g
      properties:
        calories:
          type: number
          format: double
          description: |
            已取整到 50 千卡。菜谱营养是按食材表估算的，
            报一个 1783 会让人以为这个数字比实际可靠。
        protein_g:
          type: number
          format: double
        carbs_g:
          type: number
          format: double
        fat_g:
          type: number
          format: double
    DailyNutritionAchieved:
      type: object
      additionalProperties: false
      description: |
        这份菜单排出来的每日平均能量，供与目标对照。
        同样是方案本身的量，不是用户实际吃进去的量。
      required:
        - calories
        - protein_g
        - carbs_g
      properties:
        calories:
          type: number
          format: double
        protein_g:
          type: number
          format: double
        carbs_g:
          type: number
          format: double
        fat_g:
          type: number
          format: double
          nullable: true
          description: 有任何一道菜缺脂肪数据就为空，不把缺的当 0 加进去。
    MealPlanSuggestionNote:
      type: object
      additionalProperties: false
      required:
        - kind
        - message
      properties:
        kind:
          type: string
          enum:
            - cook_time_relaxed
            - slot_unfilled
            - pool_repeats
            - energy_floored
            - energy_estimated
            - target_unreachable
            - profile_incomplete
          description: |
            - cook_time_relaxed：可选菜太少，放宽了「最长烹饪时间」。
              **过敏原与忌口永远不会被放宽**，没有对应的 kind。
            - slot_unfilled：这一格实在没有可选的菜，留空了。
            - pool_repeats：可选菜不足一周的餐数，出现了重复。
            - energy_floored：算出来的热量低于安全下限，已按下限安排。
            - energy_estimated：性别没填，热量目标按男女中间值估算。
            - target_unreachable：可选菜凑不到热量目标，实际值与目标有明显差距。
            - profile_incomplete：身高体重年龄没填全，算不出热量目标，
              这次按营养排名选菜。
        message:
          type: string
          description: 直接展示给用户的中文说明。
        meal_slot:
          $ref: '#/components/schemas/RecipeMealSlot'
    MealPlanSuggestion:
      type: object
      additionalProperties: false
      description: |
        一份**还没确认**的周菜单建议。

        它不落库。用户点「采用本周菜单」后走 confirmMealPlan 才算数，
        和 MealPlan 的说明是同一条规则：预览只是预览。

        生成是确定性的：同一个 seed 必然给出同一份结果。
        客户端切走再切回来不该换菜——那会让人以为自己刚才看到的菜没了。
        换一批就递增 seed。
      required:
        - week_start
        - seed
        - entries
        - candidates
        - achieved
        - notes
      properties:
        week_start:
          type: string
          format: date
        seed:
          type: integer
          description: |
            本次生成用的种子。原样回传，客户端「换一批」时提交 seed + 1。
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealPlanEntry'
        candidates:
          description: |
            硬过滤后各时段还剩多少道可选。
            这个数字是给客户端判断「菜少是因为筛得狠」而不是「接口坏了」用的。
          allOf:
            - $ref: '#/components/schemas/MealPlanCandidateCounts'
        daily_target:
          description: |
            按身高、体重、年龄、活动量与目标算出的每日热量与碳蛋脂目标。

            **身体数据缺任何一项就为空**，此时选菜退回按营养排名打分。
            不拿默认体重顶上：编一个数会给出看起来很确定、但对这个人是错的目标。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DailyNutritionTarget'
        achieved:
          description: |
            这份菜单排出来的每日平均能量，供客户端与目标对照。
            没有 daily_target 时同样返回，只是没有可比的目标。
          allOf:
            - $ref: '#/components/schemas/DailyNutritionAchieved'
        notes:
          type: array
          description: |
            本次生成中做了什么妥协。**空数组表示没有妥协**。
            不把妥协说出来的话，用户看到的就是一份莫名其妙的菜单。
          items:
            $ref: '#/components/schemas/MealPlanSuggestionNote'
    MealPlanSuggestionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/MealPlanSuggestion'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ShoppingDraftItem:
      type: object
      additionalProperties: false
      description: 合并后的一项食材。合并与分类由服务端做，客户端不重算。
      required:
        - name
        - group
        - quantity_text
        - recipe_ids
      properties:
        name:
          type: string
        group:
          $ref: '#/components/schemas/RecipeIngredientGroup'
        quantity_text:
          type: string
          description: |
            合并后的份量描述，例如“鸡蛋 6 个”。
            单位不一致时按原样并列，不硬凑成一个数——
            “2 个 + 少许”算不出一个准确总量，编一个反而误导。
        recipe_ids:
          type: array
          description: 这项食材来自哪几道菜，客户端据此显示来源。
          items:
            type: string
    ShoppingDraft:
      type: object
      additionalProperties: false
      required:
        - week_start
        - items
      properties:
        week_start:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingDraftItem'
    ShoppingDraftResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ShoppingDraft'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ShoppingListItemInput:
      type: object
      additionalProperties: false
      required:
        - name
        - quantity_text
      properties:
        name:
          type: string
        quantity_text:
          type: string
        recipe_ids:
          type: array
          items:
            type: string
    CreateShoppingListRequest:
      type: object
      additionalProperties: false
      description: |
        把选中的食材创建成正式购物清单（TaskList + Task）。
        用户排除家中已有食材之后才提交，服务端不替他决定买什么。
      required:
        - week_start
        - items
      properties:
        week_start:
          type: string
          format: date
        list_name:
          type: string
          maxLength: 40
          description: 不传时服务端按周生成，例如“8月17日那周的采购”。
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ShoppingListItemInput'
    ImportantDateEntry:
      type: object
      additionalProperties: false
      required:
        - event
        - next_occurrence_date
        - days_until
      properties:
        event:
          $ref: '#/components/schemas/Event'
        next_occurrence_date:
          type: string
          format: date
          description: |
            下一次发生的当地日期。按年重复时由服务端投影，
            2 月 29 日在非闰年投影到 2 月 28 日；详情仍展示原始月日。
        days_until:
          type: integer
          description: 距离下一次发生还有几天。今天为 0，已过期且不重复时为负数。
    ImportantDatesResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: 按 next_occurrence_date 升序返回，客户端不得重排。
          items:
            $ref: '#/components/schemas/ImportantDateEntry'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ReviewMetric:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - value
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
          format: double
        unit:
          type: string
          nullable: true
        delta_vs_previous:
          type: number
          format: double
          nullable: true
