        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/assistant/threads/{thread_id}/turns:
    post:
      operationId: createTurn
      summary: 发送一条消息并触发回复
      description: |
        同步保存用户消息并返回 202 与 operation_id，回复在 Worker 中异步生成。
        客户端通过 Operation 轮询，完成后读取消息列表。

        想要逐字体验时，可以另外连接
        `GET /v1/assistant/turns/{turn_id}/stream`（SSE，帧结构见
        TurnStreamEvent）。它只是传输方式，不是新的权威状态源：
        连不上或中途断开时退回轮询即可，不会丢内容。
      tags:
        - assistant
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '202':
          description: 已受理，回复任务已入队。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/assistant/turns/{turn_id}/stream:
    get:
      operationId: streamTurn
      summary: 订阅回复的实时进度
      description: |
        SSE 长连接。它只是传输方式，不是新的权威状态源：
        连不上、中途断开或事件丢失都不影响正确性，客户端读 Message
        与 Operation 就能恢复全貌，也可以完全不用它、只轮询 Operation。

        服务端实现挂在传输层而不是生成的 strict server 上：
        后者给不出可以持续 flush 的写入口。这一条与本地存储的传输端点同理。
      tags:
        - assistant
      parameters:
        - $ref: '#/components/parameters/TurnId'
      responses:
        '200':
          description: |
            事件流。每帧一个 TurnStreamEvent；
            收到 done 或 error 后连接结束。
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TurnStreamEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 同时打开的流已达上限，请退回轮询。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assistant/turns/{turn_id}/cancel:
    post:
      operationId: cancelTurn
      summary: 取消仍在执行的回复
      tags:
        - assistant
      parameters:
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已请求取消。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
