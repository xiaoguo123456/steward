      description: |
        从未填写过问卷时返回一份默认档案，completed 为 false。
        不返回 404：客户端要的是“现在按什么口径推荐”，而不是“有没有这行记录”。
      tags:
        - recipes
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateDietProfile
      summary: 修改饮食档案
      description: 身体数据只允许用户自己填写与修改，不接受任何推断结果。
      tags:
        - recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDietProfileRequest'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/meal-plans:
    get:
      operationId: getMealPlan
      summary: 读取某一周已确认的菜单
      description: |
        不传 week_start 时返回本周。本周从哪天开始由服务端按用户偏好算，
        客户端不自行推导。该周没有确认过菜单时 entries 为空数组。
      tags:
        - recipes
      parameters:
        - name: week_start
          in: query
          required: false
          description: 该周的第一天。不传时服务端按用户偏好计算本周。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: confirmMealPlan
      summary: 采用本周菜单
      description: |
        整周一次性提交并覆盖该周的已确认菜单。
        AI 生成的预览必须先经用户确认才能走到这里。
      tags:
        - recipes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMealPlanRequest'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/meal-plans/suggestion:
    get:
      operationId: getMealPlanSuggestion
      summary: 按饮食档案生成一周菜单建议
      description: |
        只读：算出一份建议并返回，不写入任何东西。用户确认后走 confirmMealPlan。

        选菜是确定性的 Go 代码，不调用模型：同样的档案与 seed 必然得到同样的菜单。
        过敏原与忌口是硬过滤，可选菜再少也不会为了填满一周而放宽——
        填不满就留空并在 notes 里说明。
      tags:
        - recipes
      parameters:
        - name: week_start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: seed
          in: query
          required: false
          description: 换一批时递增。不传按 0 处理。
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanSuggestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/meal-plans/shopping-draft:
    get:
      operationId: getMealPlanShoppingDraft
      summary: 按已确认菜单合并出待采购食材
      description: |
        只读：合并重复食材与份量并按品类分组，不创建任何东西。
        用户在此基础上排除家中已有食材，再调用创建接口。
      tags:
        - recipes
      parameters:
        - name: week_start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date
          in: query
          required: false
          description: |
            只算某一天的食材。不传时算整周。
            合并仍然在服务端做——客户端自己合并会和「创建清单」那一步不一致。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createShoppingListFromMealPlan
      summary: 用选中的食材创建购物清单
      description: |
        复用 TaskList / Task，不创建与之同义的食材待办类型。
        每项 Task 记录来源菜谱，用户在清单里看得到这项是为哪道菜买的。
      tags:
        - recipes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingListRequest'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/important-dates:
    get:
      operationId: getImportantDates
      summary: 读取重要日及其下一次发生日期
      description: |
        重要日复用 event_kind=important_date 的全天 Event，这里只做投影与排序。
        年度投影、2 月 29 日与时区换算都由服务端确定性代码计算，客户端不得重排。
        新增与修改仍然走普通的 Event 接口。
      tags:
        - views
      parameters:
        - name: limit
          in: query
          required: false
          description: 最多返回多少条，默认 50。
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportantDatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reviews/weekly:
    get:
      operationId: getWeeklyReview
      summary: 读取某一周的复盘
      description: |
        确定性指标始终可用。AI 叙述与建议在 Provider 不可用时为空，
        页面仍然展示指标与来源。
      tags:
        - views
      parameters:
        - name: week_of
          in: query
          required: false
          description: 该周内任意一天的当地日期。不传时为本周。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reviews/weekly/generate:
    post:
      operationId: generateWeeklyReview
      summary: 生成本周复盘的叙述与建议
      description: |
        返回 202 与 operation_id，叙述在 Worker 中异步生成。
        确定性指标不依赖这一步：即使生成失败，复盘页仍然完整可用。
        没有来源支撑的结论会被丢弃，不会出现在建议里。
      tags:
        - views
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                week_of:
                  type: string
                  format: date
                  nullable: true
                  description: 该周内任意一天的当地日期。不传时为本周。
      responses:
        '202':
          description: 已受理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/search:
    get:
      operationId: search
      summary: 跨实体关键词检索
      description: 只返回已确认的正式内容，处理中或待确认的 Capture 不会出现。
      tags:
        - views
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ObjectType'
          style: form
          explode: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/operations/{operation_id}:
    get:
      operationId: getOperation
      summary: 读取异步任务状态
      description: |
        Operation 只返回结果引用，不内嵌完整实体正文，
        以免幂等快照、日志与轮询响应复制用户正文。
      tags:
        - system
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/activities:
    get:
      operationId: listActivityBatches
      summary: 读取变更历史
      tags:
        - system
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 按创建时间倒序返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityBatchesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/activities/{batch_id}/undo:
    post:
      operationId: undoActivityBatch
      summary: 撤销一个变更批次
      description: |
        目标在本批次之后再次变化时不可撤销，返回 VERSION_CONFLICT 并要求重新加载。
      tags:
        - system
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 撤销成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后获得的 Access Token。过期时使用 Refresh Token 换取新的。
  schemas:
    PhoneCodeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
      properties:
        phone:
          type: string
          description: 中国大陆手机号，11 位数字。
          pattern: ^1[3-9][0-9]{9}$
          example: '13800138000'
        purpose:
          type: string
          description: 验证码用途，用于区分登录与换绑等场景的限流口径。
          enum:
            - login
            - change_phone
          default: login
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: 服务端为本次请求生成的追踪 ID，便于用户反馈与日志定位。
          example: req_01J8Z3
      description: 所有成功响应共有的元信息。
    PhoneCodeResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - expires_in_seconds
            - resend_after_seconds
          properties:
            expires_in_seconds:
              type: integer
              description: 验证码有效期。
            resend_after_seconds:
              type: integer
              description: 允许再次发送前需要等待的秒数。
            dev_code:
              type: string
              nullable: true
              description: 仅在开发环境返回的固定验证码，生产环境恒为 null。
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorCode:
      type: string
      description: |
        稳定错误码。App 只能依赖此枚举做分支，不得解析 message 文案。
        新增错误码必须同时定义默认中文文案、是否可重试和推荐 App 动作。
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - RESOURCE_NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PHONE_INVALID
        - PHONE_ALREADY_IN_USE
        - VERIFICATION_CODE_INVALID
        - VERIFICATION_CODE_EXPIRED
        - REFRESH_TOKEN_INVALID
        - TASK_LIST_NAME_DUPLICATED
        - TASK_LIST_NOT_EMPTY
        - TASK_LIST_DEFAULT_REQUIRED
        - TASK_STATUS_TRANSITION_INVALID
        - EVENT_TIME_RANGE_INVALID
        - EVENT_RECURRENCE_NOT_ALLOWED
        - TRACKER_SCHEMA_INVALID
        - RECORD_VALUES_INVALID
        - PROJECT_HAS_OPEN_TASKS
        - OBJECT_ALREADY_DELETED
        - CAPTURE_NOT_READY
        - CAPTURE_ALREADY_CONFIRMED
        - CAPTURE_REVISION_STALE
        - CAPTURE_QUESTION_RESOLVED
        - AI_PROVIDER_UNAVAILABLE
        - AI_PROVIDER_RATE_LIMITED
        - AI_SCHEMA_INVALID
        - AI_SOURCE_INVALID
        - AI_BUDGET_EXCEEDED
        - AI_TURN_CANCELLED
        - AI_PROPOSAL_STALE
        - AI_PROPOSAL_EXPIRED
        - AI_PROPOSAL_ALREADY_RESOLVED
        - AI_PROPOSAL_EDIT_NOT_ALLOWED
        - MEMORY_RELEARN_BLOCKED
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: 出错字段的路径，例如 scheduled_end_at。
        message:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 面向用户的默认中文文案。App 可以覆盖为更贴合场景的文案。
        retryable:
          type: boolean
          description: 是否可以用相同参数安全重试。
        reload_target:
          type: boolean
          description: App 是否需要重新加载目标资源后再重试。
          default: false
        details:
          type: array
          description: 字段级校验明细，仅在 VALIDATION_FAILED 等场景出现。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: ^1[3-9][0-9]{9}$
        code:
          type: string
          pattern: ^[0-9]{6}$
        timezone:
          type: string
          description: 客户端当前 IANA 时区，用于首次初始化默认值。
          example: Asia/Shanghai
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - phone
        - display_name
        - timezone
        - initialized
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: usr_01J8Z3
        phone:
          type: string
          description: 已脱敏的手机号，中间四位为星号。
          example: 138****8000
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        timezone:
          type: string
          description: 用户时区，所有日期语义换算的基准。
          example: Asia/Shanghai
        initialized:
          type: boolean
          description: 是否已完成首次初始化流程。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - tokens
            - user
            - is_new_user
          properties:
            tokens:
              $ref: '#/components/schemas/TokenPair'
            user:
              $ref: '#/components/schemas/User'
            is_new_user:
              type: boolean
              description: 为 true 时 App 进入初始化流程。
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmptyResponse:
      type: object
      additionalProperties: false
      required:
        - meta
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        avatar_url:
          type: string
          nullable: true
        timezone:
          type: string
    UserPreferences:
      type: object
      additionalProperties: false
      required:
        - week_start
        - work_day_start
        - work_day_end
        - default_reminder_local_time
        - updated_at
      properties:
        week_start:
          type: string
          description: 周视图起始日。
          enum:
            - monday
            - sunday
        work_day_start:
          type: string
          description: 工作时间开始，格式 HH:MM，用于安排建议与日历高亮。
          example: '09:00'
        work_day_end:
          type: string
          example: '18:00'
        default_reminder_local_time:
          type: string
          description: 全天 Event 与 due_date 提醒的默认当地触发时间。
          example: '09:00'
        updated_at:
          type: string
          format: date-time
    UserPreferencesResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/UserPreferences'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UpdateUserPreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        week_start:
          type: string
          enum:
            - monday
            - sunday
        work_day_start:
          type: string
        work_day_end:
          type: string
        default_reminder_local_time:
          type: string
    AiSettings:
      type: object
      additionalProperties: false
      required:
        - capture_parse_enabled
        - suggestion_enabled
        - memory_learning_enabled
        - updated_at
      properties:
        capture_parse_enabled:
          type: boolean
          description: 关闭后 Capture 只保存原始输入，不调用 AI 解析。
        suggestion_enabled:
          type: boolean
          description: 关闭后不生成任何 AI 建议。
        memory_learning_enabled:
          type: boolean
          description: 关闭后不再生成新的长期记忆建议。
        updated_at:
          type: string
          format: date-time
    AiSettingsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AiSettings'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UpdateAiSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        capture_parse_enabled:
          type: boolean
        suggestion_enabled:
          type: boolean
        memory_learning_enabled:
          type: boolean
    TaskListKind:
      type: string
