        data:
          type: array
          items:
            $ref: '#/components/schemas/CaptureQuestion'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AnswerCaptureQuestionRequest:
      type: object
      additionalProperties: false
      required:
        - answer
      properties:
        answer:
          type: string
          minLength: 1
          description: 用户补充的文字说明。服务端据此创建新 revision 重新解析。
    ThreadStatus:
      type: string
