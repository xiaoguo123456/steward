      type: object
      additionalProperties: false
      required:
        - kind
        - content_type
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        content_type:
          type: string
          description: |
            客户端声明的 MIME。它只用于早期拒绝与生成扩展名，
            服务端在上传完成后仍会回查真实类型，不采信这里的值。
          example: image/jpeg
        byte_size:
          type: integer
          format: int64
          nullable: true
          description: 预估大小，仅用于提前拒绝超限文件。
    CreateUploadGrantsRequest:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/UploadGrantRequestItem'
    UploadGrant:
      type: object
      additionalProperties: false
      required:
        - media_id
        - upload_url
        - method
        - expires_at
      properties:
        media_id:
          type: string
          example: med_01J8Z3
        upload_url:
          type: string
          description: |
            短期直传地址。客户端按 method 发送字节并带上 headers 即可，
            不需要知道背后是哪家对象存储。该地址不得写入日志或分享。
        method:
          type: string
          enum:
            - PUT
            - POST
        headers:
          type: object
          additionalProperties:
            type: string
          description: 上传时必须原样携带的请求头，其中 Content-Type 参与签名。
        max_bytes:
          type: integer
          format: int64
          description: 该类型允许的最大字节数，超出时上传会被拒绝。
        expires_at:
          type: string
          format: date-time
          description: 过期后需要重新申请授权，但仍复用同一个 media_id。
    CreateUploadGrantsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UploadGrant'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MediaStatus:
      type: string
      description: |
        pending 表示已分配授权但尚未确认上传；uploaded 表示服务端已回查过真实元数据；
        只有 uploaded 的资产可以被 Capture 引用。
      enum:
        - pending
        - uploaded
        - failed
        - deleted
