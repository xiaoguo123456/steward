name: Android 测试包
run-name: Android 测试包 ${{ inputs.app_version }} · ${{ inputs.commit_sha }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "要打包的 main 分支 commit SHA（完整或前 12 位）"
        required: true
        type: string
      app_version:
        description: "目标 App 版本号，必须与准备验证的生产版本一致，例如 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: steward-android-test
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Android 测试 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: test
    outputs:
      apk_name: ${{ steps.vars.outputs.apk_name }}
    env:
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      EXPO_PUBLIC_API_URL: https://test-steward.qhzhiyin.com
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: steward-test
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
      STEWARD_EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 释放 Android 构建磁盘空间
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            sudo find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -exec rm -rf -- {} +
          fi
          docker system prune --all --force
          sudo apt-get clean
          df -h /

      - name: 校验并检出 main 中的指定提交
        id: vars
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$requested" =~ ^[0-9a-f]{12}([0-9a-f]{28})?$ ]]; then
            echo "commit SHA 必须是 12 位或 40 位十六进制" >&2
            exit 1
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "App 版本号格式错误：$APP_VERSION" >&2
            exit 1
          fi

          git fetch origin main
          actual="$(git rev-parse "${requested}^{commit}" 2>/dev/null || true)"
          if [ -z "$actual" ]; then
            echo "找不到提交：$requested" >&2
            exit 1
          fi
          case "$actual" in
            "$requested"*) ;;
            *) echo "解析出的提交 $actual 与输入 $requested 不一致" >&2; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$actual" origin/main; then
            echo "提交不属于 main：$actual" >&2
            exit 1
          fi
          git checkout --detach "$actual"

          current_epoch="$(date -u +%s)"
          version_code="$((current_epoch - 1577836800))"
          if [ "$version_code" -le 0 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "生成的 Android versionCode 超出有效范围：$version_code" >&2
            exit 1
          fi
          {
            echo "full_sha=$actual"
            echo "version_code=$version_code"
            echo "apk_name=steward-test-${APP_VERSION}-${actual::12}.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装依赖并检查移动端
        run: |
          pnpm install --frozen-lockfile
          pnpm mobile:lint
          pnpm mobile:typecheck

      - name: 安装 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: 恢复测试签名
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/steward-test.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: 恢复 OTA 验签证书
        env:
          CERTIFICATE_BASE64: ${{ secrets.EXPO_UPDATES_CERTIFICATE_BASE64 }}
          CERTIFICATE_PATH: apps/mobile/.expo-updates/certificate.pem
        run: |
          test -n "$STEWARD_EXPO_PROJECT_ID"
          test -n "$CERTIFICATE_BASE64"
          umask 077
          mkdir -p "$(dirname "$CERTIFICATE_PATH")"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          bash tools/check-expo-update-certificate.sh "$CERTIFICATE_PATH"
          echo "STEWARD_EXPO_UPDATES_CERTIFICATE=.expo-updates/certificate.pem" >> "$GITHUB_ENV"

      - name: 构建并签名测试 APK
        env:
          APP_VARIANT: test
          STEWARD_APP_VERSION: ${{ inputs.app_version }}
          STEWARD_ANDROID_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          STEWARD_BUILD_SHA: ${{ steps.vars.outputs.full_sha }}
          STEWARD_REQUIRE_EXPO_UPDATES: "1"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/steward-test.jks
        run: scripts/build-android-apk.sh test "output/android/${{ steps.vars.outputs.apk_name }}"

      - name: 保存测试 APK（30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            output/android/${{ steps.vars.outputs.apk_name }}
            output/android/${{ steps.vars.outputs.apk_name }}.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  publish:
    name: 发布测试 APK 公共下载
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      APK_NAME: ${{ needs.build.outputs.apk_name }}
    steps:
      - name: 检出当前测试下载配置
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 下载本次构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: output/public-download

      - name: 校验待发布文件
        run: |
          set -euo pipefail
          test -f "output/public-download/$APK_NAME"
          test -f "output/public-download/$APK_NAME.sha256"
          (cd output/public-download && sha256sum --check "$APK_NAME.sha256")

      - name: 备份测试下载入口配置
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -eu
            cd /opt/steward-test
            mkdir -p .public-download-backup downloads
            cp docker-compose.test.yml .public-download-backup/docker-compose.test.yml
            cp deploy/nginx.conf .public-download-backup/nginx.conf

      - name: 同步测试下载入口配置
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.test.yml,deploy/nginx.conf"
          target: /opt/steward-test
          overwrite: true

      - name: 上传测试 APK 与校验文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "output/public-download/*.apk,output/public-download/*.apk.sha256"
          target: /opt/steward-test/downloads
          strip_components: 2
          overwrite: true

      - name: 校验并启用测试下载入口
        uses: appleboy/ssh-action@v1
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          ACR_PULL_REGISTRY: ${{ secrets.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: APK_NAME,ACR_PULL_REGISTRY,ACR_NAMESPACE
          script: |
            set -eu
            cd /opt/steward-test
            export ACR_REGISTRY="$ACR_PULL_REGISTRY"
            export ACR_NAMESPACE
            compose="docker compose --project-name steward-test -f docker-compose.test.yml"

            rollback() {
              cp .public-download-backup/docker-compose.test.yml docker-compose.test.yml
              cp .public-download-backup/nginx.conf deploy/nginx.conf
              $compose up -d --no-deps --force-recreate nginx || true
            }
            trap rollback EXIT

            download_dir=/opt/steward-test/downloads
            test -f "$download_dir/$APK_NAME"
            test -f "$download_dir/$APK_NAME.sha256"
            chmod 0644 "$download_dir/$APK_NAME" "$download_dir/$APK_NAME.sha256"
            cd "$download_dir"
            sha256sum --check "$APK_NAME.sha256"

            cd /opt/steward-test
            $compose run --rm --no-deps nginx nginx -t
            $compose up -d --no-deps --force-recreate nginx

            ready=0
            for i in $(seq 1 12); do
              if curl -fsSI http://127.0.0.1:8088/healthz >/dev/null \
                && curl -fsSI "http://127.0.0.1:8088/downloads/$APK_NAME" >/dev/null; then
                ready=1
                break
              fi
              sleep 5
            done
            test "$ready" = 1

            trap - EXIT

      - name: 验证测试包公开下载地址
        run: |
          set -euo pipefail
          apk_url="https://test-steward.qhzhiyin.com/downloads/$APK_NAME"
          checksum_url="$apk_url.sha256"
          curl --fail --silent --show-error --head --retry 6 --retry-delay 5 "$apk_url"
          curl --fail --silent --show-error --head --retry 6 --retry-delay 5 "$checksum_url"

      - name: 清理旧测试安装包
        uses: appleboy/ssh-action@v1
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: APK_NAME
          script: |
            set -eu
            download_dir=/opt/steward-test/downloads
            test -f "$download_dir/$APK_NAME"
            test -f "$download_dir/$APK_NAME.sha256"

            for old_apk in "$download_dir"/steward-test-*.apk; do
              test -e "$old_apk" || continue
              test "$(basename "$old_apk")" = "$APK_NAME" && continue
              rm -f -- "$old_apk" "$old_apk.sha256"
            done

            remaining="$(find "$download_dir" -maxdepth 1 -type f -name 'steward-test-*.apk' | wc -l | tr -d ' ')"
            test "$remaining" -eq 1
            echo "测试 APK 保留数量：$remaining"

      - name: 汇总测试包下载信息
        run: |
          set -euo pipefail
          apk_url="https://test-steward.qhzhiyin.com/downloads/$APK_NAME"
          checksum_url="$apk_url.sha256"
          {
            echo "### Android 测试包公共下载已发布"
            echo
            echo "- APK：$apk_url"
            echo "- SHA256：$checksum_url"
            echo "- 保留策略：服务器只保留最新 1 个测试包；GitHub Artifact 保留 30 天"
          } >> "$GITHUB_STEP_SUMMARY"
