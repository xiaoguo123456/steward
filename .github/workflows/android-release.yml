name: Android 正式发布
run-name: Android ${{ inputs.app_version }} · ${{ inputs.commit_sha }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "要打包的 main 分支 commit SHA（完整或前 12 位）"
        required: true
        type: string
      app_version:
        description: "App 版本号，例如 1.0.0"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: steward-android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建并发布 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 释放 Android 构建磁盘空间
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            sudo find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -exec rm -rf -- {} +
          fi
          docker system prune --all --force
          sudo apt-get clean
          df -h /

      - name: 校验版本并检出 main 中的指定提交
        id: vars
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$requested" =~ ^[0-9a-f]{12}([0-9a-f]{28})?$ ]]; then
            echo "commit SHA 必须是 12 位或 40 位十六进制" >&2
            exit 1
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "App 版本号格式错误：$APP_VERSION" >&2
            exit 1
          fi

          git fetch origin main
          actual="$(git rev-parse "${requested}^{commit}" 2>/dev/null || true)"
          if [ -z "$actual" ]; then
            echo "找不到提交：$requested" >&2
            exit 1
          fi
          case "$actual" in
            "$requested"*) ;;
            *) echo "解析出的提交 $actual 与输入 $requested 不一致" >&2; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$actual" origin/main; then
            echo "提交不属于 main：$actual" >&2
            exit 1
          fi
          git checkout --detach "$actual"

          current_epoch="$(date -u +%s)"
          version_code="$((current_epoch - 1577836800))"
          if [ "$version_code" -le 0 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "生成的 Android versionCode 超出有效范围：$version_code" >&2
            exit 1
          fi
          {
            echo "full_sha=$actual"
            echo "version_code=$version_code"
            echo "apk_name=steward-${APP_VERSION}-${actual::12}.apk"
            echo "release_tag=android-v${APP_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: 确认版本未发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "发布版本已存在：$RELEASE_TAG" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: 安装依赖并检查移动端
        run: |
          pnpm install --frozen-lockfile
          pnpm mobile:lint
          pnpm mobile:typecheck

      - name: 安装 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: 恢复生产签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/steward-production.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: 恢复 OTA 验签证书
        env:
          STEWARD_EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          CERTIFICATE_BASE64: ${{ secrets.EXPO_UPDATES_CERTIFICATE_BASE64 }}
          CERTIFICATE_PATH: apps/mobile/.expo-updates/certificate.pem
        run: |
          test -n "$STEWARD_EXPO_PROJECT_ID"
          test -n "$CERTIFICATE_BASE64"
          umask 077
          mkdir -p "$(dirname "$CERTIFICATE_PATH")"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "STEWARD_EXPO_UPDATES_CERTIFICATE=.expo-updates/certificate.pem" >> "$GITHUB_ENV"

      - name: 构建并签名生产 APK
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://steward.qhzhiyin.com
          STEWARD_EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          STEWARD_APP_VERSION: ${{ inputs.app_version }}
          STEWARD_ANDROID_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          STEWARD_BUILD_SHA: ${{ steps.vars.outputs.full_sha }}
          STEWARD_REQUIRE_EXPO_UPDATES: "1"
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/steward-production.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: steward-production
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
        run: scripts/build-android-apk.sh production "output/android/${{ steps.vars.outputs.apk_name }}"

      - name: 保存生产 APK（30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            output/android/${{ steps.vars.outputs.apk_name }}
            output/android/${{ steps.vars.outputs.apk_name }}.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: 创建 Android 正式发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          APK_NAME: ${{ steps.vars.outputs.apk_name }}
          APP_VERSION: ${{ inputs.app_version }}
          RELEASE_SHA: ${{ steps.vars.outputs.full_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "output/android/$APK_NAME" \
            "output/android/$APK_NAME.sha256" \
            --target "$RELEASE_SHA" \
            --title "Android $APP_VERSION" \
            --notes "生产环境 Android APK，来源提交：$RELEASE_SHA"

      - name: 发布无需登录的公共下载
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          gh workflow run android-public-download.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "release_tag=$RELEASE_TAG"
