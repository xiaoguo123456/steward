name: 测试环境部署

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.*.example"
  workflow_dispatch:
    inputs:
      build_android:
        description: "同时生成 Android 测试 APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: steward-test-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: 生成、迁移与全量检查
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.android_changes.outputs.build_android }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steward_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steward_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEWARD_HTTP_ADDR: ":8787"
      STEWARD_DATABASE_URL: postgres://steward_app:steward_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_DATABASE_URL: postgres://steward_app:steward_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_ADMIN_DATABASE_URL: postgres://steward_admin:steward_admin_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_MIGRATE_URL: postgres://postgres:postgres@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_JWT_SECRET: ci-only-jwt-secret
      STEWARD_MEMORY_FINGERPRINT_KEY: ci-only-fingerprint-secret
      STEWARD_SMS_PROVIDER: dev
      STEWARD_DEV_SMS_CODE: "123456"
      STEWARD_AI_PROVIDER: fake
      STEWARD_STORAGE_DRIVER: localfs
      STEWARD_STORAGE_ROOT: /tmp/steward-ci-storage
      STEWARD_STREAM_DRIVER: postgres
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 判断是否需要生成 Android 测试包
        id: android_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BUILD_ANDROID: ${{ inputs.build_android }}
        run: |
          set -euo pipefail
          build_android=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            build_android="${MANUAL_BUILD_ANDROID:-false}"
          elif [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            build_android=true
          elif ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            apps/mobile \
            packages/api-client \
            packages/contracts/openapi/openapi.yaml \
            packages/contracts/openapi/components \
            packages/contracts/openapi/paths \
            packages/contracts/dist/openapi.bundle.yaml \
            scripts/build-android-apk.sh \
            .github/workflows/test.yml \
            package.json \
            pnpm-workspace.yaml; then
            build_android=true
          fi

          echo "build_android=$build_android" >> "$GITHUB_OUTPUT"
          echo "是否生成 Android 测试包：$build_android"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile
          cd apps/backend
          go mod download
      - name: 校验代码生成无漂移
        run: |
          make generate
          git diff --exit-code
      - name: 验证空库迁移
        run: make migrate-test
      - name: 运行全量检查
        run: make check

  build-and-deploy:
    name: 构建镜像并部署测试环境
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: 计算不可变镜像标签
        id: vars
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR 公网地址
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-backend:test-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-backend:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-backend
          cache-to: type=gha,mode=max,scope=steward-backend

      - name: 构建并推送移动 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/mobile-web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-mobile-web:test-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-mobile-web:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-mobile-web
          cache-to: type=gha,mode=max,scope=steward-mobile-web

      - name: 构建并推送管理台镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/admin-web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-admin-web:test-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-admin-web:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-admin-web
          cache-to: type=gha,mode=max,scope=steward-admin-web

      - name: 中转 Nginx 基础镜像到 ACR
        run: |
          docker pull nginx:1.27-alpine
          docker tag nginx:1.27-alpine "${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/nginx:1.27-alpine"
          docker push "${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/nginx:1.27-alpine"

      - name: 同步部署文件到测试服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.test.yml,deploy/nginx.conf"
          target: /opt/steward-test

      - name: 拉取镜像并更新测试环境
        uses: appleboy/ssh-action@v1
        env:
          ACR_PULL_REGISTRY: ${{ secrets.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: ACR_PULL_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script: |
            set -eu
            cd /opt/steward-test
            echo "$ACR_PASSWORD" | docker login "$ACR_PULL_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            export ACR_REGISTRY="$ACR_PULL_REGISTRY"
            export ACR_NAMESPACE IMAGE_TAG
            compose="docker compose --project-name steward-test -f docker-compose.test.yml"

            $compose pull
            if ! $compose up -d --remove-orphans; then
              echo "容器启动失败，输出迁移与应用日志。"
              $compose ps --all || true
              $compose logs --no-color --tail=100 migrate api admin-api worker nginx || true
              exit 1
            fi
            $compose restart nginx

            healthy=0
            for i in $(seq 1 36); do
              if curl -fsSI http://127.0.0.1:8088/healthz >/dev/null \
                && curl -fsS http://127.0.0.1:8088/admin-healthz >/dev/null \
                && curl -fsS http://127.0.0.1:8088/ >/dev/null \
                && curl -fsS http://127.0.0.1:8088/admin/ >/dev/null; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" = 1 ]; then
              echo "$IMAGE_TAG" > .last-good-tag
              exit 0
            fi

            echo "健康检查失败，尝试回滚到上一个正常版本。"
            if [ -s .last-good-tag ]; then
              previous_tag="$(cat .last-good-tag)"
              export IMAGE_TAG="$previous_tag"
              $compose pull
              $compose up -d --remove-orphans
              $compose restart nginx
              for i in $(seq 1 12); do
                if curl -fsSI http://127.0.0.1:8088/healthz >/dev/null \
                  && curl -fsS http://127.0.0.1:8088/admin-healthz >/dev/null; then
                  echo "已回滚到 $previous_tag；本次部署仍判定失败。"
                  break
                fi
                sleep 5
              done
            else
              echo "首次部署没有可回滚版本，需要人工检查。"
            fi

            $compose ps
            $compose logs --no-color --tail=100 api admin-api worker migrate nginx
            exit 1

  build-android-apk:
    name: 生成 Android 测试包
    runs-on: ubuntu-latest
    needs:
      - checks
      - build-and-deploy
    if: needs.checks.outputs.build_android == 'true'
    env:
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      EXPO_PUBLIC_API_URL: https://test-steward.qhzhiyin.com
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: steward-test
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算包版本和文件名
        id: vars
        run: |
          {
            echo "version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
            echo "apk_name=steward-test-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::12}.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: 安装依赖和 Android SDK
        run: |
          pnpm install --frozen-lockfile
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: 恢复测试签名
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/steward-test.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: 构建并签名测试 APK
        env:
          APP_VARIANT: test
          STEWARD_ANDROID_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          STEWARD_BUILD_SHA: ${{ github.sha }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/steward-test.jks
        run: scripts/build-android-apk.sh test "output/android/${{ steps.vars.outputs.apk_name }}"

      - name: 保存测试 APK（30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            output/android/${{ steps.vars.outputs.apk_name }}
            output/android/${{ steps.vars.outputs.apk_name }}.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: true
