name: 生产环境部署
run-name: 生产部署 Android ${{ inputs.app_version }} · ${{ inputs.commit_sha }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "要发布的 main 分支 commit SHA（完整或前 12 位）"
        required: true
        type: string
      app_version:
        description: "App 版本号，例如 1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: steward-prod-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: 校验提交、生成、迁移与全量检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steward_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steward_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEWARD_HTTP_ADDR: ":8787"
      STEWARD_DATABASE_URL: postgres://steward_app:steward_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_DATABASE_URL: postgres://steward_app:steward_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_ADMIN_DATABASE_URL: postgres://steward_admin:steward_admin_dev_password@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_TEST_MIGRATE_URL: postgres://postgres:postgres@127.0.0.1:5432/steward_ci?sslmode=disable
      STEWARD_JWT_SECRET: ci-only-jwt-secret
      STEWARD_MEMORY_FINGERPRINT_KEY: ci-only-fingerprint-secret
      STEWARD_AI_PROVIDER: fake
      STEWARD_STORAGE_DRIVER: localfs
      STEWARD_STORAGE_ROOT: /tmp/steward-ci-storage
      STEWARD_STREAM_DRIVER: postgres
    steps:
      - name: 检出指定提交
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: 校验提交属于 main
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          requested="$REQUESTED_SHA"
          if [[ ! "$requested" =~ ^[0-9a-fA-F]{12}([0-9a-fA-F]{28})?$ ]]; then
            echo "commit SHA 必须是 12 位或 40 位十六进制" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          case "$actual" in
            "$requested"*) ;;
            *) echo "检出的提交 $actual 与输入 $requested 不一致" >&2; exit 1 ;;
          esac
          git fetch origin main
          git merge-base --is-ancestor "$actual" origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile
          cd apps/backend
          go mod download
      - name: 校验代码生成无漂移
        run: |
          make generate
          git diff --exit-code
      - name: 验证空库迁移
        run: make migrate-test
      - name: 运行全量检查
        run: make check

  build-and-deploy:
    name: 构建镜像并部署生产环境
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    permissions:
      contents: write
    steps:
      - name: 检出指定提交
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: 校验提交并计算不可变镜像标签
        id: vars
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -eu
          requested="$REQUESTED_SHA"
          if [[ ! "$requested" =~ ^[0-9a-fA-F]{12}([0-9a-fA-F]{28})?$ ]]; then
            echo "commit SHA 必须是 12 位或 40 位十六进制" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          case "$actual" in
            "$requested"*) ;;
            *) echo "检出的提交 $actual 与输入 $requested 不一致" >&2; exit 1 ;;
          esac
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "App 版本号格式错误：$APP_VERSION" >&2
            exit 1
          fi
          {
            echo "sha=${actual::12}"
            echo "full_sha=$actual"
            echo "version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
            echo "apk_name=steward-${APP_VERSION}-${actual::12}.apk"
            echo "release_tag=android-v${APP_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: 确认 Android 版本未发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "发布版本已存在：$RELEASE_TAG" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: 安装移动端依赖和 Android SDK
        run: |
          pnpm install --frozen-lockfile
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: 恢复生产签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/steward-production.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: 构建并签名生产 APK
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://steward.qhzhiyin.com
          STEWARD_APP_VERSION: ${{ inputs.app_version }}
          STEWARD_ANDROID_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          STEWARD_BUILD_SHA: ${{ steps.vars.outputs.full_sha }}
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/steward-production.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: steward-production
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
        run: scripts/build-android-apk.sh production "output/android/${{ steps.vars.outputs.apk_name }}"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR 公网地址
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-backend:prod-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-backend:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-backend
          cache-to: type=gha,mode=max,scope=steward-backend

      - name: 构建并推送移动 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/mobile-web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-mobile-web:prod-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-mobile-web:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-mobile-web
          cache-to: type=gha,mode=max,scope=steward-mobile-web

      - name: 构建并推送管理台镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/admin-web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-admin-web:prod-latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/steward-admin-web:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=steward-admin-web
          cache-to: type=gha,mode=max,scope=steward-admin-web

      - name: 中转 Nginx 基础镜像到 ACR
        run: |
          docker pull nginx:1.27-alpine
          docker tag nginx:1.27-alpine "${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/nginx:1.27-alpine"
          docker push "${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/nginx:1.27-alpine"

      - name: 同步部署文件到生产服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,deploy/nginx.conf"
          target: /opt/steward-prod

      - name: 拉取镜像并更新生产环境
        uses: appleboy/ssh-action@v1
        env:
          ACR_PULL_REGISTRY: ${{ secrets.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: ACR_PULL_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script: |
            set -eu
            cd /opt/steward-prod
            echo "$ACR_PASSWORD" | docker login "$ACR_PULL_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            export ACR_REGISTRY="$ACR_PULL_REGISTRY"
            export ACR_NAMESPACE IMAGE_TAG
            compose="docker compose --project-name steward-prod -f docker-compose.prod.yml"

            $compose pull
            $compose up -d --remove-orphans
            $compose restart nginx

            healthy=0
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:8088/healthz >/dev/null \
                && curl -fsS http://127.0.0.1:8088/admin-healthz >/dev/null \
                && curl -fsS http://127.0.0.1:8088/ >/dev/null \
                && curl -fsS http://127.0.0.1:8088/admin/ >/dev/null; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" = 1 ]; then
              echo "$IMAGE_TAG" > .last-good-tag
              exit 0
            fi

            echo "健康检查失败，尝试回滚到上一个正常版本。"
            if [ -s .last-good-tag ]; then
              previous_tag="$(cat .last-good-tag)"
              export IMAGE_TAG="$previous_tag"
              $compose pull
              $compose up -d --remove-orphans
              $compose restart nginx
              for i in $(seq 1 12); do
                if curl -fsS http://127.0.0.1:8088/healthz >/dev/null \
                  && curl -fsS http://127.0.0.1:8088/admin-healthz >/dev/null; then
                  echo "已回滚到 $previous_tag；本次部署仍判定失败。"
                  break
                fi
                sleep 5
              done
            else
              echo "首次部署没有可回滚版本，需要人工检查。"
            fi

            $compose ps
            $compose logs --tail=100 api admin-api worker migrate nginx
            exit 1

      - name: 保存生产 APK（30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            output/android/${{ steps.vars.outputs.apk_name }}
            output/android/${{ steps.vars.outputs.apk_name }}.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: 创建 Android 正式发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          APK_NAME: ${{ steps.vars.outputs.apk_name }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "发布版本已存在：$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "output/android/$APK_NAME" \
            "output/android/$APK_NAME.sha256" \
            --target "$(git rev-parse HEAD)" \
            --title "Android $APP_VERSION" \
            --notes "生产环境 Android APK，来源提交：$(git rev-parse HEAD)"
